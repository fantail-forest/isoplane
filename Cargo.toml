[workspace]
resolver = "2"
members = [
    "crates/wisp-abi",
    "crates/wisp-engine",
    "crates/wisp-hibernate",
    "crates/wisp-host",
    "crates/wisp-control",
    "crates/wisp-proxy",
    "crates/wispd",
    "crates/wisp-cli",
    "tests",
]
exclude = ["crates/spike", "guests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.txt"
rust-version = "1.85"

[workspace.dependencies]
wisp-abi       = { path = "crates/wisp-abi" }
wisp-engine    = { path = "crates/wisp-engine" }
wisp-hibernate = { path = "crates/wisp-hibernate" }
wisp-host      = { path = "crates/wisp-host" }
wisp-control   = { path = "crates/wisp-control" }
wisp-proxy     = { path = "crates/wisp-proxy" }

anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
postcard    = { version = "1", features = ["alloc"] }
toml        = "0.9"
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"
futures     = "0.3"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
libc        = "0.2"
zstd        = "0.13"
blake3      = "1"
hex         = "0.4"
rand        = "0.9"
rusqlite    = { version = "0.37", features = ["bundled"] }
hyper       = { version = "1", features = ["full"] }
hyper-util  = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes       = "1"
aes-gcm     = "0.10"
clap        = { version = "4", features = ["derive", "env"] }
wasmparser  = "0.244"

# Line tables preserve source locations for workspace development backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
