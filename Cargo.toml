[workspace]
resolver = "2"
members = [
    "crates/wisp-abi",
    "crates/wisp-engine",
    "crates/wisp-hibernate",
    "crates/wisp-host",
    "crates/wisp-control",
    "crates/wisp-runtime",
    "crates/wisp-proxy",
    "crates/wispd",
    "crates/wisp-cli",
    "crates/wisp-fixtures",
]
exclude = ["crates/spike", "guests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.txt"
rust-version = "1.88"

[workspace.dependencies]
wisp-abi       = { path = "crates/wisp-abi" }
wisp-engine    = { path = "crates/wisp-engine" }
wisp-hibernate = { path = "crates/wisp-hibernate" }
wisp-host      = { path = "crates/wisp-host" }
wisp-runtime   = { path = "crates/wisp-runtime", default-features = false }
wisp-control   = { path = "crates/wisp-control" }
wisp-proxy     = { path = "crates/wisp-proxy" }
wisp-fixtures  = { path = "crates/wisp-fixtures" }

anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
postcard    = { version = "1", features = ["alloc"] }
toml        = "0.9"
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures     = "0.3"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
libc        = "0.2"
zstd        = "0.13"
blake3      = "1"
hex         = "0.4"
rand        = "0.9"
scc            = "3.8"    # the future table's maps, on the wake path
rusqlite    = { version = "0.37", features = ["bundled"] }
hyper       = { version = "1", features = ["full"] }
hyper-util  = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes       = "1"
aes-gcm     = "0.10"
clap        = { version = "4", features = ["derive", "env"] }
wasmparser  = "0.244"
# Default features off: the defaults pull in `async` (fiber stack switching)
# and `threads`. Each crate names the features it needs.
wasmtime    = { version = "48", default-features = false }
wat         = "1"
tempfile    = "3"
fd-lock     = "4"
# Pre-init runs wizer's embedded wasmtime, which compiles through rayon. Named
# here so guest preparation can bound that pool; must resolve to the same rayon
# both wasmtime versions use, or `install` would scope a pool nobody consults.
rayon       = "1"
wizer       = "10"
base64      = "0.22"
reqwest     = { version = "0.12", features = ["json"], default-features = false }
sha1        = "0.10"

# Line tables preserve source locations for workspace development backtraces.
[profile.dev]
debug = "line-tables-only"
# Disable incremental compilation to limit development build storage.
incremental = false

# Keep development debug information focused on workspace crates.
[profile.dev.package."*"]
debug = false

[profile.release.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "debuginfo"
