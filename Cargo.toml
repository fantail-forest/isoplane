[workspace]
resolver = "2"
members = [
    "crates/isoplane-abi",
    "crates/isoplane-engine",
    "crates/isoplane-hibernate",
    "crates/isoplane-host",
    "crates/isoplane-control",
    "crates/isoplane-runtime",
    "crates/isoplane-prepare",
    "crates/isoplane-trust",
    "crates/isoplane-proxy",
    "crates/isoplaned",
    "crates/isoplane-native",
    "crates/isoplane-fixtures",
    "crates/isoplane-runtime-acceptance",
    "crates/isoplane-harness",
]
exclude = ["crates/spike", "guests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.txt"
rust-version = "1.88"

[workspace.dependencies]
csbindgen = "=1.9.8"
procfs = { version = "0.18", default-features = false }
libproc = "0.14.11"
fs4 = "1.1.0"
portable-pty = "0.9.0"
isoplane-abi       = { path = "crates/isoplane-abi" }
isoplane-engine    = { path = "crates/isoplane-engine" }
isoplane-hibernate = { path = "crates/isoplane-hibernate" }
isoplane-host      = { path = "crates/isoplane-host" }
isoplane-trust     = { path = "crates/isoplane-trust" }
isoplane-runtime   = { path = "crates/isoplane-runtime", default-features = false }
isoplane-prepare   = { path = "crates/isoplane-prepare" }
isoplane-control   = { path = "crates/isoplane-control" }
isoplane-proxy     = { path = "crates/isoplane-proxy" }
isoplane-fixtures  = { path = "crates/isoplane-fixtures" }
isoplane-harness   = { path = "crates/isoplane-harness" }

anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
postcard    = { version = "1", features = ["alloc"] }
toml        = "0.9"
tokio       = { version = "1", features = ["full", "test-util"] }
tokio-util  = { version = "0.7", features = ["rt", "codec"] }
async-trait = "0.1"
futures     = "0.3"
socket2 = "0.6.5"
hickory-resolver = { version = "0.26.2", default-features = false, features = ["system-config", "tokio"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.32", default-features = false, features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["logs", "trace", "internal-logs"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry-appender-tracing = { version = "0.32", default-features = false }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["logs", "trace", "http-proto", "reqwest-blocking-client", "internal-logs"] }
# The exporter's reqwest 0.13 selects its TLS provider through this entry, not through
# opentelemetry-http's reqwest-rustls feature, which would compile a second rustls
# provider (aws-lc-rs) beside ring and leave rustls unable to pick a default.
reqwest-otlp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "blocking"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "logs", "trace"] }
prost = "0.14"
url = { version = "2", features = ["serde"] }
parking_lot = "0.12"
libc        = "0.2"
cpu-time    = "1.0"
windows-sys = { version = "0.61", features = ["Win32_System_Performance", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_Security"] }
win32job = "2.0.3"
zstd        = "0.13"
blake3      = "1"
hex         = "0.4"
rand        = "0.9"
scc            = "3.8"    # the future table's maps, on the wake path
rusqlite    = { version = "0.37", features = ["bundled"] }
hyper       = { version = "1", features = ["full"] }
brotli      = "8"
h2          = "0.4"    # the HTTP/2 framing hyper speaks, for test peers that drive it directly
# TLS for host-terminated https egress (already in the graph through reqwest).
rustls      = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
hyper-util  = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes       = "1"
flate2      = "1"
aes-gcm     = "0.10"
clap        = { version = "4", features = ["derive", "env"] }
wasmparser  = "0.244"
wasm-encoder = { version = "0.244", features = ["wasmparser"] }
# Preparation and execution share this Wasmtime dependency configuration.
# Engine construction and module validation apply guest capability restrictions.
wasmtime    = { git = "https://github.com/fantail-forest/isoplane-wasmtime", rev = "5d2fff464e9735e337f69494db1e26fa14ee158c", default-features = false, features = [
    "anyhow", "runtime", "std", "cranelift", "winch", "pooling-allocator", "call-hook",
    "backtrace", "demangle", "addr2line", "parallel-compilation", "profiling", "gc", "gc-null",
] }
wat         = "1"
tempfile    = "3"
memmap2 = "0.9"
linux-raw-sys = { version = "0.12", features = ["ioctl"] }
fd-lock     = "4"
nix = { version = "0.30.1", default-features = false, features = ["fs"] }
rustix = { version = "1.1.4", features = ["process", "event"] }
rayon       = "1"
base64      = "0.22"
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha1        = "0.10"
sha2        = "0.10"

# Line tables preserve source locations for workspace development backtraces.
[profile.dev]
debug = "line-tables-only"
# Disable incremental compilation to limit development build storage.
incremental = false

# Keep development debug information focused on workspace crates.
[profile.dev.package."*"]
debug = false
# Tests compile large WASM guests at runtime; the compiler's own hot paths
# need optimization. Workspace code retains its development profile.
opt-level = 2

[profile.release.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "debuginfo"
