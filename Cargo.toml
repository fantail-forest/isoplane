[workspace]
resolver = "2"
members = [
    "crates/wisp-abi",
    "crates/wisp-engine",
    "crates/wisp-hibernate",
    "crates/wisp-host",
    "crates/wisp-control",
    "crates/wisp-runtime",
    "crates/wisp-prepare",
    "crates/wisp-trust",
    "crates/wisp-proxy",
    "crates/wispd",
    "crates/wisp-cli",
    "crates/wisp-fixtures",
    "crates/wisp-runtime-acceptance",
    "crates/wisp-harness",
]
exclude = ["crates/spike", "guests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.txt"
rust-version = "1.88"

[workspace.dependencies]
rustix = { version = "1.1.4", features = ["process"] }
fs4 = "1.1.0"
portable-pty = "0.9.0"
wisp-abi       = { path = "crates/wisp-abi" }
wisp-engine    = { path = "crates/wisp-engine" }
wisp-hibernate = { path = "crates/wisp-hibernate" }
wisp-host      = { path = "crates/wisp-host" }
wisp-trust     = { path = "crates/wisp-trust" }
wisp-runtime   = { path = "crates/wisp-runtime", default-features = false }
wisp-prepare   = { path = "crates/wisp-prepare" }
wisp-control   = { path = "crates/wisp-control" }
wisp-proxy     = { path = "crates/wisp-proxy" }
wisp-fixtures  = { path = "crates/wisp-fixtures" }
wisp-harness   = { path = "crates/wisp-harness" }

anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
postcard    = { version = "1", features = ["alloc"] }
toml        = "0.9"
tokio       = { version = "1", features = ["full", "test-util"] }
tokio-util  = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures     = "0.3"
socket2 = "0.6.5"
hickory-resolver = { version = "0.26.2", default-features = false, features = ["system-config", "tokio"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.32", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["logs", "internal-logs"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "internal-logs"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "0.14"
url = { version = "2", features = ["serde"] }
parking_lot = "0.12"
libc        = "0.2"
cpu-time    = "1.0"
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }
zstd        = "0.13"
blake3      = "1"
hex         = "0.4"
rand        = "0.9"
scc            = "3.8"    # the future table's maps, on the wake path
rusqlite    = { version = "0.37", features = ["bundled"] }
hyper       = { version = "1", features = ["full"] }
brotli      = "8"
h2          = "0.4"    # the HTTP/2 framing hyper speaks, for test peers that drive it directly
# TLS for host-terminated https egress (already in the graph through reqwest).
rustls      = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
hyper-util  = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes       = "1"
flate2      = "1"
aes-gcm     = "0.10"
clap        = { version = "4", features = ["derive", "env"] }
wasmparser  = "0.244"
wasm-encoder = { version = "0.244", features = ["wasmparser"] }
# Default features off: the defaults pull in `async` (fiber stack switching)
# and `threads`. Each crate names the features it needs.
wasmtime    = { version = "48", default-features = false }
wat         = "1"
tempfile    = "3"
memmap2 = "0.9"
linux-raw-sys = { version = "0.12", features = ["ioctl"] }
fd-lock     = "4"
# Pre-init runs wizer's embedded wasmtime, which compiles through rayon. Named
# here so guest preparation can bound that pool; must resolve to the same rayon
# both wasmtime versions use, or `install` would scope a pool nobody consults.
rayon       = "1"
wizer       = "10"
base64      = "0.22"
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha1        = "0.10"
sha2        = "0.10"

# Line tables preserve source locations for workspace development backtraces.
[profile.dev]
debug = "line-tables-only"
# Disable incremental compilation to limit development build storage.
incremental = false

# Keep development debug information focused on workspace crates.
[profile.dev.package."*"]
debug = false

[profile.release.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "debuginfo"
