version: '3'

tasks:
  default:
    desc: Prepare shared fixtures before running tests
    deps: [':node:runtimes', ':fixtures:rust', ':fixtures:dotnet', ':fixtures:acceptance', ':fixtures:package', ':cli', ':managed:tests', ':test:debugger:environment', ':fixtures:feed', ':test:managed:host']

  rust:
    desc: Build portable Rust WASM fixtures
    deps: [':initialize']
    sources:
      - tools/BuildProtocol/WasmMemory.props
      - guests/**/*.rs
      - guests/**/Cargo.toml
      - guests/Cargo.lock
      - guests/.cargo/**/*
      - guest-sdks/rust/**/*.rs
      - guest-sdks/rust/**/Cargo.toml
      - crates/isoplane-abi/**/*
      - guests/build.sh
    generates:
      - .build/wasm32/rust-guests/manifest
      - .build/wasm32/rust-guests/hello.wasm
      - .build/wasm32/rust-guests/quotes-api.wasm
      - .build/wasm32/rust-guests/misbehaver.wasm
      - .build/wasm32/rust-guests/bigheap.wasm
      - .build/wasm32/rust-guests/impure-cctor.wasm
      - .build/wasm32/rust-guests/undeclared-import.wasm
      - .build/wasm32/rust-guests/foreign-module.wasm
    cmds:
      - 'bash guests/build.sh --compile'

  feed:
    run: once
    deps: [':managed:packages', ':managed:native-packages']

  dotnet:
    deps:
      - task: dotnet:isoplane_guest_dotnet_activation
      - task: dotnet:isoplane_guest_dotnet_certificates
      - task: dotnet:isoplane_guest_dotnet_streaming
      - task: dotnet:isoplane_guest_dotnet_hashing
      - task: dotnet:isoplane_guest_dotnet_trust
      - task: dotnet:isoplane_guest_dotnet_randomness
      - task: dotnet:isoplane_guest_dotnet_memory
      - task: dotnet:isoplane_guest_dotnet_config
      - task: dotnet:isoplane_guest_dotnet_failing_boot
      - task: dotnet:isoplane_guest_dotnet_network_refusal
      - task: dotnet:isoplane_guest_dotnet_dns
      - task: dotnet:isoplane_guest_dotnet_stream
      - task: dotnet:isoplane_guest_dotnet_connect
      - task: dotnet:isoplane_guest_dotnet_cleanup
      - task: dotnet:isoplane_guest_dotnet_timer
      - task: dotnet:isoplane_guest_dotnet_logs
      - task: dotnet:isoplane_guest_dotnet_filesystem
      - task: dotnet:isoplane_guest_aspnet
      - task: dotnet:isoplane_guest_dotnet_request
      - task: dotnet:isoplane_guest_dotnet_upload
      - task: dotnet:isoplane_guest_dotnet

  dotnet:isoplane_guest_dotnet_activation:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_activation
          PROBE: ActivationProbe

  dotnet:isoplane_guest_dotnet_certificates:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_certificates
          PROBE: CertificateProbe

  dotnet:isoplane_guest_dotnet_streaming:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_streaming
          PROBE: StreamingProbe

  dotnet:isoplane_guest_dotnet_hashing:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_hashing
          PROBE: HashingProbe

  dotnet:isoplane_guest_dotnet_trust:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_trust
          PROBE: TrustProbe

  dotnet:isoplane_guest_dotnet_randomness:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_randomness
          PROBE: RandomnessProbe

  dotnet:isoplane_guest_dotnet_memory:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_memory
          PROBE: MemoryProbe

  dotnet:isoplane_guest_dotnet_config:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_config
          PROBE: ConfigProbe

  dotnet:isoplane_guest_dotnet_failing_boot:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_failing_boot
          PROBE: FailingBoot

  dotnet:isoplane_guest_dotnet_network_refusal:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_network_refusal
          PROBE: NetworkRefusalProbe

  dotnet:isoplane_guest_dotnet_dns:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_dns
          PROBE: DnsProbe

  dotnet:isoplane_guest_dotnet_stream:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_stream
          PROBE: StreamProbe

  dotnet:isoplane_guest_dotnet_connect:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_connect
          PROBE: ConnectProbe

  dotnet:isoplane_guest_dotnet_cleanup:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_cleanup
          PROBE: CleanupProbe

  dotnet:isoplane_guest_dotnet_timer:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_timer
          PROBE: TimerProbe

  dotnet:isoplane_guest_dotnet_logs:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_logs
          PROBE: LogProbe

  dotnet:isoplane_guest_dotnet_filesystem:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_filesystem
          PROBE: FilesystemProbe

  dotnet:isoplane_guest_aspnet:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_aspnet
          PROJECT: guests/aspnet/src

  dotnet:isoplane_guest_dotnet_request:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_request
          PROBE: RequestProbe

  dotnet:isoplane_guest_dotnet_upload:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_upload
          PROBE: UploadProbe

  dotnet:isoplane_guest_dotnet:
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet
          PROBE: Api

  acceptance:
    cmds:
      - task: probe:build
        vars:
          NAME: guest_runtime_acceptance
          PROJECT: guest-runtime/tests/guest/src

  package:
    deps:
      - task: package:alpha
      - task: package:beta
      - task: package:native
      - task: package:web
      - task: package:debugger
      - task: package:debugger-optimized
      - task: package:diagnostics
      - task: debugger:hotreload:package

  package:build:
    run: when_changed
    deps: [":managed:build"]
    internal: true
    label: 'package:{{.NAME}}'
    env:
      ISOPLANE_CLI: '{{.CLI}}'
    sources:
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/{{.NAME}}/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/{{.SOURCE_NAME | default .NAME}}/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/*.props'
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/*.targets'
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/build.sh'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/**/*'
      - '{{.ROOT_DIR}}/tools/Isoplane.Cli/**/*.cs'
      - '{{.ROOT_DIR}}/tools/Isoplane.Cli/*.csproj'
      - '{{.ROOT_DIR}}/tools/BuildProtocol/**/*.cs'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/global.json'
      - '{{.ROOT_DIR}}/nuget.config'
      - '{{.MODULES}}/runtime.json'
      - exclude: 'guest-sdks/**/{obj,bin,out,__pycache__,*.Tests,Tests}/**/*'
      - exclude: 'guests/**/{obj,bin,out,__pycache__}/**/*'
      - exclude: 'guest-runtime/tests/packages/**/{obj,bin,.isoplane,__pycache__}/**/*'
      - exclude: 'tools/**/{obj,bin,out,__pycache__,*.Tests}/**/*'
    generates:
      - '{{.ROOT_DIR}}/.build/clr-anycpu/package-fixtures/{{.NAME}}.tar'
    cmds:
      - 'bash guest-runtime/tests/packages/build.sh --compile --fixture {{.NAME}}'

  package:alpha:
    deps: [':runtime']
    cmds:
      - task: package:build
        vars:
          NAME: alpha

  package:beta:
    deps: [':runtime']
    cmds:
      - task: package:build
        vars:
          NAME: beta

  package:native:
    deps: [':runtime']
    cmds:
      - task: package:build
        vars:
          NAME: native

  package:web:
    deps: [':runtime']
    cmds:
      - task: package:build
        vars:
          NAME: web

  package:debugger:
    deps: [':runtime', 'debugger:sources']
    cmds:
      - task: package:build
        vars:
          NAME: debugger

  package:debugger-optimized:
    # Both variants write the shared HotReloadFixture project's build outputs.
    deps: [':runtime', 'debugger:sources', 'package:debugger']
    cmds:
      - task: package:build
        vars:
          NAME: debugger-optimized
          SOURCE_NAME: debugger

  debugger:sources:
    sources:
      - guest-runtime/tests/packages/debugger/async.cs.in
      - guest-runtime/tests/packages/debugger/awaiter.cs.in
      - guest-runtime/tests/packages/debugger/tracking.cs.in
      - guest-runtime/tests/packages/debugger/pool_reuse.cs.in
      - guest-runtime/tests/packages/debugger/prepare.py
    generates:
      - .build/clr-anycpu/debugger-sources/async-stack.cs
      - .build/clr-anycpu/debugger-sources/async-composed.cs
      - .build/clr-anycpu/debugger-sources/async-valuetask.cs
      - .build/clr-anycpu/debugger-sources/async-pooled.cs
      - .build/clr-anycpu/debugger-sources/async-pooled-composed.cs
    cmds:
      - '"{{.PYTHON}}" guest-runtime/tests/packages/debugger/prepare.py'

  debugger:hotreload:
    desc: Prepare the host-specific Hot Reload baseline and compiler deltas
    label: 'debugger:hotreload:{{.PLATFORM}}'
    run: once
    deps: [':initialize']
    env:
      ArtifactsPath: '{{.HOT_RELOAD_ARTIFACTS}}'
    sources:
      - guest-runtime/tests/packages/debugger/hotreload/*
      - guest-runtime/tests/packages/debugger/hotreload.cs
      - guest-runtime/tests/packages/debugger/hotreload.updated.cs.in
      - guest-runtime/tests/packages/debugger/hotreload.updated-again.cs.in
      - Directory.Build.props
      - global.json
      - nuget.config
      - taskfiles/fixtures.yml
    generates:
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.dll'
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.pdb'
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.dll.1.dmeta'
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.dll.1.dil'
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.dll.1.dpdb'
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.dll.2.dmeta'
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.dll.2.dil'
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.dll.2.dpdb'
    cmds:
      - '"{{.DOTNET}}" build guest-runtime/tests/packages/debugger/hotreload/HotReloadFixture.csproj -c Release -p:DeltaScript=deltas.json --artifacts-path "{{.HOT_RELOAD_ARTIFACTS}}"'

  debugger:hotreload:package:
    desc: Prepare the reusable guest whose symbols match this host's compiler paths
    label: 'debugger:hotreload:package:{{.PLATFORM}}'
    deps: [':managed:build', ':runtime', 'debugger:sources', 'debugger:hotreload']
    env:
      ArtifactsPath: '{{.HOT_RELOAD_ARTIFACTS}}'
      ISOPLANE_MANAGED_ARTIFACTS: '{{.HOT_RELOAD_ARTIFACTS}}'
      ISOPLANE_FIXTURE_ARTIFACTS: '{{.HOT_RELOAD_ARTIFACTS}}'
      ISOPLANE_RUNTIME_DIRECTORY: '{{.MODULES}}'
    sources:
      - guest-runtime/tests/packages/debugger/**/*
      - guest-runtime/tests/packages/*.props
      - guest-runtime/tests/packages/*.targets
      - guest-sdks/dotnet/**/*
      - tools/Isoplane.Cli/**/*.cs
      - tools/Isoplane.Cli/*.csproj
      - tools/BuildProtocol/**/*.cs
      - Directory.Build.props
      - global.json
      - nuget.config
      - taskfiles/fixtures.yml
      - '{{.MODULES}}/runtime.json'
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.dll'
      - '{{.HOT_RELOAD_ARTIFACTS}}/bin/HotReloadFixture/release/Debugger.HotReload.Fixture.pdb'
      - exclude: 'guest-sdks/**/{obj,bin,out,__pycache__,*.Tests,Tests}/**/*'
      - exclude: 'guest-runtime/tests/packages/**/{obj,bin,.isoplane,__pycache__}/**/*'
      - exclude: 'tools/**/{obj,bin,out,__pycache__,*.Tests}/**/*'
    generates:
      - '{{.HOT_RELOAD_ARTIFACTS}}/debugger.tar'
    cmds:
      - '"{{.DOTNET}}" "{{.CLI}}" bundle --project "{{.ROOT_DIR}}/guest-runtime/tests/packages/debugger" --output "{{.HOT_RELOAD_ARTIFACTS}}/debugger.tar"'

  package:diagnostics:
    deps: [':runtime']
    cmds:
      - task: package:build
        vars:
          NAME: diagnostics

  probe:build:
    internal: true
    vars:
      PROJECT: '{{.PROJECT | default "guest-runtime/tests/probes"}}'
      PROBE: '{{.PROBE | default ""}}'
    label: 'probe:{{.NAME}}'
    deps:
      - ':cli'
      - ':runtime'
    sources:
      - '{{.ROOT_DIR}}/{{.PROJECT}}/**/*.cs'
      - '{{.ROOT_DIR}}/{{.PROJECT}}/**/*.csproj'
      - '{{.ROOT_DIR}}/taskfiles/fixtures.yml'
      - '{{.ROOT_DIR}}/guests/dotnet/src/App/filesystem-resource.txt'
      - '{{.ROOT_DIR}}/guests/dotnet/src/App/{{.PROBE}}.cs'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/**/*'
      - '{{.ROOT_DIR}}/tools/BuildProtocol/**/*'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/global.json'
      - '{{.ROOT_DIR}}/nuget.config'
      - '{{.MODULES}}/runtime.json'
      - exclude: 'guest-sdks/**/{obj,bin,out,__pycache__,*.Tests,Tests}/**/*'
      - exclude: 'tools/**/{obj,bin,out,__pycache__}/**/*'
      - exclude: 'guest-runtime/tests/probes/{obj,bin,.isoplane}/**/*'
    generates:
      - '{{.ROOT_DIR}}/.build/clr-anycpu/probes/{{.NAME}}.tar'
    env:
      IsoplaneProbe: '{{.PROBE}}'
      IsoplaneProbeSymbol: 'ISOPLANE_{{trimSuffix "Probe" .PROBE | upper}}_PROBE'
      ISOPLANE_FIXTURE_ARTIFACTS: '{{.ROOT_DIR}}/.build/clr-anycpu/probe-intermediates/{{.NAME}}'
      ISOPLANE_MANAGED_ARTIFACTS: '{{.MANAGED}}'
      ArtifactsPath: '{{.MANAGED}}'
      ISOPLANE_RUNTIME_DIRECTORY: '{{.MODULES}}'
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.build/clr-anycpu/probes"
      - 'test "{{OS}}" = linux || { echo "Run task fixtures on Linux first." >&2; exit 1; }'
      - '"{{.DOTNET}}" "{{.CLI}}" bundle --project "{{.ROOT_DIR}}/{{.PROJECT}}" --output "{{.ROOT_DIR}}/.build/clr-anycpu/probes/{{.NAME}}.tar"'

  editor:
    desc: Prepare a customer application for the VS Code launch journey
    deps: [':managed:packages']
    sources:
      - tools/vscode-isoplane/test/prepare.py
      - '{{.PACKAGES}}/*.nupkg'
    generates:
      - '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/editor-fixture/app/Program.cs'
      - '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/editor-fixture/app/nuget.config'
    cmds:
      - '"{{.PYTHON}}" tools/vscode-isoplane/test/prepare.py "{{.ROOT_DIR}}/.build/{{.PLATFORM}}/editor-fixture"'
