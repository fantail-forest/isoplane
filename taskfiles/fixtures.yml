version: '3'

tasks:
  default:
    desc: Prepare shared fixtures before running tests
    cmds:
      - task: ':managed:all-tests'
      - task: default:prepared
  rust:
    desc: Build portable Rust WASM fixtures
    deps: [':initialize']
    sources:
      - tools/BuildProtocol/WasmMemory.props
      - guests/**/*.rs
      - guests/**/Cargo.toml
      - guests/Cargo.lock
      - guests/.cargo/**/*
      - guest-sdks/rust/**/*.rs
      - guest-sdks/rust/**/Cargo.toml
      - crates/isoplane-abi/**/*
      - guests/build.sh
    generates:
      - .build/wasm32/rust-guests/manifest
      - .build/wasm32/rust-guests/hello.wasm
      - .build/wasm32/rust-guests/quotes-api.wasm
      - .build/wasm32/rust-guests/misbehaver.wasm
      - .build/wasm32/rust-guests/impure-cctor.wasm
      - .build/wasm32/rust-guests/undeclared-import.wasm
      - .build/wasm32/rust-guests/foreign-module.wasm
    cmds:
      - 'bash guests/build.sh --compile'

  feed:
    cmds:
      - task: ':managed:packages'
      - task: feed:prepared
  runtime:
    desc: Compile the shared runtime once for the sessions the native tests start
    cmds:
      - task: ':managed:packages'
      - task: runtime:prepared
  projects:
    desc: Install the CLI and build the .NET projects the native tests copy
    cmds:
      - task: ':managed:packages'
      - task: projects:prepared
  projects:build:
    internal: true
    label: 'projects:build:{{base .PROJECT}}'
    env:
      ISOPLANE_CLI: '{{.TEST_DOTNET}}/tool/isoplane{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - cp "{{.TEST_DOTNET}}/global.json" "{{.TEST_DOTNET}}/nuget.config" "{{.PROJECT}}/"
      - '"{{.DOTNET}}" {{.STEP | default "build"}} "{{.PROJECT}}"{{if not .STEP}} --configuration Debug{{end}} -nologo -p:IsoplaneReleaseVersion={{.VERSION}}'
      - cp "{{.TEST_DOTNET}}/offline.config" "{{.PROJECT}}/nuget.config"

  compiled-runtime:
    desc: Compile the shared runtime for the engine tests load it under
    cmds:
      - task: ':runtime'
      - task: compiled-runtime:prepared
  dotnet:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.Probes.slnf}
      - task: dotnet:prepared
  dotnet:isoplane_guest_dotnet_native_io:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.Probes.slnf}
      - task: dotnet:isoplane_guest_dotnet_native_io:prepared
  dotnet:isoplane_guest_dotnet_bcl:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.Probes.slnf}
      - task: dotnet:isoplane_guest_dotnet_bcl:prepared
  dotnet:isoplane_guest_dotnet_node:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.Probes.slnf}
      - task: dotnet:isoplane_guest_dotnet_node:prepared
  dotnet:isoplane_guest_dotnet_upload:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.Probes.slnf}
      - task: dotnet:isoplane_guest_dotnet_upload:prepared
  dotnet:isoplane_guest_dotnet_activation:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.Probes.slnf}
      - task: dotnet:isoplane_guest_dotnet_activation:prepared
  dotnet:isoplane_guest_dotnet_failing_boot:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.Probes.slnf}
      - task: dotnet:isoplane_guest_dotnet_failing_boot:prepared
  dotnet:isoplane_guest_aspnet:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.Probes.slnf}
      - task: dotnet:isoplane_guest_aspnet:prepared
  acceptance:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.Acceptance.slnf}
      - task: acceptance:prepared
  package:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:prepared
  package:build:
    run: when_changed
    # Runs the CLI, which needs its native library beside it.
    deps: [":cli:stage"]
    internal: true
    label: 'package:{{.NAME}}'
    vars:
      ASSEMBLY_PROJECT:
        sh: 'basename "{{.ROOT_DIR}}/guest-runtime/tests/packages/{{.NAME}}"/*.csproj .csproj'
    env:
      ISOPLANE_CLI: '{{.CLI}}'
    sources:
      - '{{.MANAGED}}/bin/{{.ASSEMBLY_PROJECT}}/**/*'
      - '{{.MANAGED}}/obj/{{.ASSEMBLY_PROJECT}}/project.assets.json'
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/{{.NAME}}/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/{{.SOURCE_NAME | default .NAME}}/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/*.props'
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/*.targets'
      - '{{.ROOT_DIR}}/guest-runtime/tests/packages/build.sh'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/**/*'
      - '{{.ROOT_DIR}}/tools/Isoplane.Cli/**/*.cs'
      - '{{.ROOT_DIR}}/tools/Isoplane.Cli/*.csproj'
      - '{{.ROOT_DIR}}/tools/BuildProtocol/**/*.cs'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/global.json'
      - '{{.ROOT_DIR}}/nuget.config'
      - '{{.MODULES}}/runtime.json'
      - exclude: 'guest-sdks/**/{obj,bin,out,__pycache__,*.Tests,Tests}/**/*'
      - exclude: 'guests/**/{obj,bin,out,__pycache__}/**/*'
      - exclude: 'guest-runtime/tests/packages/**/{obj,bin,.isoplane,__pycache__}/**/*'
      - exclude: 'tools/**/{obj,bin,out,__pycache__,*.Tests}/**/*'
    generates:
      - '{{.ROOT_DIR}}/.build/clr-anycpu/package-fixtures/{{.NAME}}.tar'
    cmds:
      - 'bash guest-runtime/tests/packages/build.sh --compile --fixture {{.NAME}}'

  package:alpha:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:alpha:prepared
  package:beta:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:beta:prepared
  package:native:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:native:prepared
  package:web:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:web:prepared
  package:session:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:session:prepared
  package:sqlite:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:sqlite:prepared
  package:sqlite-pclraw3:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:sqlite-pclraw3:prepared
  package:debugger:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:debugger:prepared
  package:debugger-optimized:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:debugger-optimized:prepared
  debugger:sources:
    sources:
      - guest-runtime/tests/packages/debugger/async.cs.in
      - guest-runtime/tests/packages/debugger/awaiter.cs.in
      - guest-runtime/tests/packages/debugger/tracking.cs.in
      - guest-runtime/tests/packages/debugger/pool_reuse.cs.in
      - guest-runtime/tests/packages/debugger/prepare.py
    generates:
      - .build/clr-anycpu/debugger-sources/async-stack.cs
      - .build/clr-anycpu/debugger-sources/async-composed.cs
      - .build/clr-anycpu/debugger-sources/async-valuetask.cs
      - .build/clr-anycpu/debugger-sources/async-pooled.cs
      - .build/clr-anycpu/debugger-sources/async-pooled-composed.cs
    cmds:
      - '"{{.PYTHON}}" guest-runtime/tests/packages/debugger/prepare.py'

  package:diagnostics:
    cmds:
      - task: ':managed:guest-fixtures'
        vars: {FILTER: Isoplane.PackageFixtures.slnf}
      - task: package:diagnostics:prepared
  probe:build:
    internal: true
    vars:
      PROJECT: '{{.PROJECT | default (printf "guest-runtime/tests/probes/%s" .PROBE)}}'
      PROBE: '{{.PROBE | default ""}}'
      ASSEMBLY_PROJECT:
        sh: 'basename "{{.ROOT_DIR}}/{{.PROJECT}}"/*.csproj .csproj'
    label: 'probe:{{.NAME}}'
    deps: [':cli:stage']
    sources:
      - '{{.MANAGED}}/bin/{{.ASSEMBLY_PROJECT}}/**/*'
      - '{{.MANAGED}}/obj/{{.ASSEMBLY_PROJECT}}/project.assets.json'
      - '{{.ROOT_DIR}}/{{.PROJECT}}/**/*.cs'
      - '{{.ROOT_DIR}}/{{.PROJECT}}/**/*.csproj'
      - '{{.ROOT_DIR}}/guest-runtime/tests/probes/Probe.{props,targets}'
      - '{{.ROOT_DIR}}/taskfiles/fixtures.yml'
      - '{{.ROOT_DIR}}/guests/dotnet/src/{Shared,{{.PROBE}}}/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/**/*'
      - '{{.ROOT_DIR}}/tools/BuildProtocol/**/*'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/global.json'
      - '{{.ROOT_DIR}}/nuget.config'
      - '{{.MODULES}}/runtime.json'
      - exclude: 'guest-sdks/**/{obj,bin,out,__pycache__,*.Tests,Tests}/**/*'
      - exclude: 'tools/**/{obj,bin,out,__pycache__}/**/*'
      - exclude: 'guest-runtime/tests/probes/{obj,bin,.isoplane}/**/*'
    generates:
      - '{{.ROOT_DIR}}/.build/clr-anycpu/probes/{{.NAME}}.tar'
    env:
      ISOPLANE_RUNTIME_DIRECTORY: '{{.MODULES}}'
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.build/clr-anycpu/probes"
      - 'test "{{OS}}" = linux || { echo "Run task fixtures on Linux first." >&2; exit 1; }'
      - '"{{.DOTNET}}" "{{.CLI}}" bundle --no-build --project "{{.ROOT_DIR}}/{{.PROJECT}}" --output "{{.ROOT_DIR}}/.build/clr-anycpu/probes/{{.NAME}}.tar"'

  editor:
    desc: Prepare a customer application for the VS Code launch journey
    cmds:
      - task: ':managed:packages'
      - task: editor:prepared

  editor:prepared:
    internal: true
    sources:
      - tools/vscode-isoplane/test/prepare.py
      - '{{.PACKAGES}}/*.nupkg'
    generates:
      - '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/editor-fixture/app/Program.cs'
      - '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/editor-fixture/app/nuget.config'
    cmds:
      - '"{{.PYTHON}}" tools/vscode-isoplane/test/prepare.py "{{.ROOT_DIR}}/.build/{{.PLATFORM}}/editor-fixture"'
  default:prepared:
    internal: true
    desc: Prepare shared fixtures before running tests
    deps: [':node:runtimes:prepared', ':fixtures:rust', ':fixtures:dotnet:prepared', ':fixtures:acceptance:prepared', ':fixtures:package:prepared', ':cli:stage', ':test:debugger:environment', ':fixtures:feed:prepared', ':fixtures:runtime:prepared', ':fixtures:projects:prepared', ':fixtures:compiled-runtime:prepared', ':test:managed:host:prepared']

  dotnet:prepared:
    internal: true
    deps:
      - task: dotnet:isoplane_guest_dotnet_native_io:prepared
      - task: dotnet:isoplane_guest_dotnet_bcl:prepared
      - task: dotnet:isoplane_guest_dotnet_node:prepared
      - task: dotnet:isoplane_guest_dotnet_upload:prepared
      - task: dotnet:isoplane_guest_dotnet_activation:prepared
      - task: dotnet:isoplane_guest_dotnet_failing_boot:prepared
      - task: dotnet:isoplane_guest_aspnet:prepared

  acceptance:prepared:
    internal: true
    cmds:
      - task: probe:build
        vars:
          NAME: guest_runtime_acceptance
          PROJECT: guest-runtime/tests/guest/src

  package:prepared:
    internal: true
    deps:
      - task: package:alpha:prepared
      - task: package:beta:prepared
      - task: package:native:prepared
      - task: package:web:prepared
      - task: package:session:prepared
      - task: package:sqlite:prepared
      - task: package:sqlite-pclraw3:prepared
      - task: package:debugger:prepared
      - task: package:debugger-optimized:prepared
      - task: package:diagnostics:prepared
      - task: debugger:hotreload:package:prepared

  feed:prepared:
    internal: true
    run: once
    deps: [':managed:packages:prepared', ':managed:native-packages:prepared']

  runtime:prepared:
    internal: true
    desc: Compile the shared runtime once for the sessions the native tests start
    run: once
    deps: [':initialize', 'feed:prepared']
    vars:
      # The packaged CLI's files and release library, so that its runtime cache entries match the installed tool's.
      PACKAGED_CLI: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/test-runtimes/cli'
    env:
      ISOPLANE_CACHE_DIR: '{{.TEST_RUNTIME_CACHE}}'
    preconditions:
      - msg: Prepare the published CLI and runtime modules with task fixtures on Linux.
        sh: 'test -f "{{.MANAGED}}/publish/Isoplane.Cli/release/Isoplane.Cli.dll" && test -f "{{.MODULES}}/runtime.json"'
    cmds:
      - '"{{.DOTNET}}" msbuild taskfiles/StageCli.proj -nologo -p:PublishedCli="{{.MANAGED}}/publish/Isoplane.Cli/release" -p:NativeLibrary="{{.RELEASE_NATIVE_LIBRARY}}" -p:CliDirectory="{{.PACKAGED_CLI}}" -p:Platform={{.PLATFORM}}'
      - '"{{.DOTNET}}" "{{.PACKAGED_CLI}}/Isoplane.Cli.dll" prepare-runtime --runtime "{{.MODULES}}"'

  projects:prepared:
    internal: true
    desc: Install the CLI and build the .NET projects the native tests copy
    run: once
    deps: [':initialize', 'feed:prepared', ':managed:native-packages:prepared']
    vars:
      VERSION:
        sh: '"{{.DOTNET}}" msbuild Directory.Build.props -nologo -getProperty:Version'
      SDK_VERSION:
        sh: '"{{.DOTNET}}" --version'
      CLI_INSTALL: '{{if eq .PLATFORM "linux-x64"}}DOTNET_RUNTIME_ID=linux-x64 {{end}}"{{.DOTNET}}" tool install'
    sources:
      - '{{.PACKAGES}}/*.nupkg'
      - '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/packages/*.nupkg'
      - '{{.ROOT_DIR}}/crates/isoplane-native/tests/fixtures/**/*'
      - '{{.ROOT_DIR}}/global.json'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/taskfiles/fixtures.yml'
      - exclude: 'crates/isoplane-native/tests/fixtures/**/{obj,bin,.isoplane}/**/*'
    generates:
      - '{{.TEST_DOTNET}}/prepared'
    cmds:
      # NuGet never extracts an id and version it already holds, and the local packages are
      # rebuilt under one version, so their earlier contents are removed first.
      - rm -rf "{{.TEST_DOTNET}}/tool" "{{.TEST_DOTNET}}/hive" "{{.TEST_DOTNET}}/fixtures" "{{.TEST_DOTNET}}/templates" "{{.TEST_DOTNET}}/prepared" "{{.TEST_DOTNET}}"/packages/isoplane.*
      - mkdir -p "{{.TEST_DOTNET}}"
      - |
        cat > "{{.TEST_DOTNET}}/global.json" <<EOF
        {
          "sdk": { "version": "{{.SDK_VERSION}}", "rollForward": "disable" },
          "msbuild-sdks": { "Isoplane.Sdk": "{{.VERSION}}", "Isoplane.AspNetCore": "{{.VERSION}}" }
        }
        EOF
      # Isoplane packages come only from the local builds: nuget.org carries the same version.
      - |
        cat > "{{.TEST_DOTNET}}/nuget.config" <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            <add key="template-packages" value="{{.PACKAGES}}" />
            <add key="native-packages" value="{{.ROOT_DIR}}/.build/{{.PLATFORM}}/packages" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="native-packages"><package pattern="Isoplane.Native" /><package pattern="Isoplane.Cli" /></packageSource>
            <packageSource key="template-packages"><package pattern="Isoplane.*" /></packageSource>
            <packageSource key="nuget"><package pattern="*" /></packageSource>
          </packageSourceMapping>
          <config>
            <add key="globalPackagesFolder" value="{{.TEST_DOTNET}}/packages" />
          </config>
        </configuration>
        EOF
      - |
        cat > "{{.TEST_DOTNET}}/offline.config" <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <!--
          No package sources, on purpose. Task restored everything this project needs into the
          shared packages folder before the tests ran, so a restore here needs no source. A test
          that references a package Task did not restore must fail its restore (NU1101) rather
          than download it: add the package to the fixture so that Task restores it.
        -->
        <configuration>
          <packageSources>
            <clear />
          </packageSources>
          <config>
            <add key="globalPackagesFolder" value="{{.TEST_DOTNET}}/packages" />
          </config>
        </configuration>
        EOF
      - '{{.CLI_INSTALL}} Isoplane.Cli --version {{.VERSION}} --tool-path "{{.TEST_DOTNET}}/tool" --configfile "{{.TEST_DOTNET}}/nuget.config"'
      - cp -R crates/isoplane-native/tests/fixtures "{{.TEST_DOTNET}}/fixtures"
      - |
        "{{.PYTHON}}" - "{{.TEST_DOTNET}}/fixtures/library/payload.bin" <<'EOF'
        import sys
        with open(sys.argv[1], "wb") as payload:
            payload.truncate(8 << 20)
        EOF
      - for: [handler, gated, testing, library]
        cmd: 'cp "{{.TEST_DOTNET}}/global.json" "{{.TEST_DOTNET}}/nuget.config" "{{.TEST_DOTNET}}/fixtures/{{.ITEM}}/"'
      - '"{{.DOTNET}}" build "{{.TEST_DOTNET}}/fixtures/Fixtures.slnx" -c Debug -p:IsoplaneReleaseVersion={{.VERSION}}'
      - for: [handler, gated, testing, library]
        cmd: 'cp "{{.TEST_DOTNET}}/offline.config" "{{.TEST_DOTNET}}/fixtures/{{.ITEM}}/nuget.config"'
      - '"{{.DOTNET}}" new install "{{.PACKAGES}}/Isoplane.Templates.{{.VERSION}}.nupkg" --debug:custom-hive "{{.TEST_DOTNET}}/hive"'
      # Each template is generated as TEMPLATE:NAME. The hyphen makes file names and namespaces
      # differ. In a solution template the first part names a namespace the template declares
      # for one of its folders: C# resolves a root-qualified name written inside a namespace
      # from the inside out, so such a reference finds the folder's namespace instead of the root.
      - for: ['isoplane-web:Template-App', 'isoplane-handler:Tests.Template-App', 'isoplane-mcpserver:Tools.Template-App', 'isoplane-webapi:Todos.Template-App', 'isoplane-webapp:Notes.Template-App']
        cmd: '"{{.DOTNET}}" new {{index (splitList ":" .ITEM) 0}} --name {{index (splitList ":" .ITEM) 1}} --output "{{.TEST_DOTNET}}/templates/{{index (splitList ":" .ITEM) 0}}" --debug:custom-hive "{{.TEST_DOTNET}}/hive"'
      # The template test builds these itself, so they are only restored here.
      - for: [isoplane-web, isoplane-handler, isoplane-mcpserver, isoplane-webapi, isoplane-webapp]
        task: projects:build
        vars: { PROJECT: '{{.TEST_DOTNET}}/templates/{{.ITEM}}', VERSION: '{{.VERSION}}', STEP: restore }
      - echo "{{.VERSION}}" > "{{.TEST_DOTNET}}/prepared"

  compiled-runtime:prepared:
    internal: true
    desc: Compile the shared runtime for the engine tests load it under
    label: 'fixtures:compiled-runtime:{{.TEST_COMPILED_RUNTIME}}'
    run: once
    deps: [':initialize']
    sources:
      - '{{.MODULES}}/Isoplane.MonoRuntime.wasm'
      - '{{.ROOT_DIR}}/crates/{isoplane-engine,isoplane-prepare,isoplane-fixtures}/src/**/*'
      - '{{.ROOT_DIR}}/crates/isoplane-prepare/examples/precompile_test_runtime.rs'
      - '{{.ROOT_DIR}}/Cargo.lock'
    generates:
      - '{{.TEST_COMPILED_RUNTIME}}/runtime.wasm'
    cmds:
      # Unix publications are read-only; Windows outputs stay writable for removal.
      - '[ "{{OS}}" = windows ] || [ ! -d "{{.TEST_COMPILED_RUNTIME}}" ] || chmod -R u+w "{{.TEST_COMPILED_RUNTIME}}"'
      - rm -rf "{{.TEST_COMPILED_RUNTIME}}"
      - '{{.DEVELOPMENT_COMMAND}}cargo run --locked --quiet -p isoplane-prepare --example precompile_test_runtime -- "{{.MODULES}}/Isoplane.MonoRuntime.wasm" "{{.TEST_COMPILED_RUNTIME}}"'

  dotnet:isoplane_guest_dotnet_native_io:prepared:
    internal: true
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_native_io
          PROBE: NativeIo

  dotnet:isoplane_guest_dotnet_bcl:prepared:
    internal: true
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_bcl
          PROBE: Bcl

  dotnet:isoplane_guest_dotnet_node:prepared:
    internal: true
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_node
          PROBE: Node

  dotnet:isoplane_guest_dotnet_upload:prepared:
    internal: true
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_upload
          PROBE: Upload

  dotnet:isoplane_guest_dotnet_activation:prepared:
    internal: true
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_activation
          PROBE: Activation

  dotnet:isoplane_guest_dotnet_failing_boot:prepared:
    internal: true
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_dotnet_failing_boot
          PROBE: FailingBoot

  dotnet:isoplane_guest_aspnet:prepared:
    internal: true
    cmds:
      - task: probe:build
        vars:
          NAME: isoplane_guest_aspnet
          PROJECT: guests/aspnet/src

  package:alpha:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: alpha

  package:beta:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: beta

  package:native:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: native

  package:web:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: web

  package:session:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: session

  package:sqlite:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: sqlite

  package:sqlite-pclraw3:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: sqlite-pclraw3
          SOURCE_NAME: sqlite

  package:debugger:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: debugger

  package:debugger-optimized:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: debugger-optimized
          SOURCE_NAME: debugger

  package:diagnostics:prepared:
    internal: true
    cmds:
      - task: package:build
        vars:
          NAME: diagnostics

  debugger:hotreload:package:prepared:
    internal: true
    deps: [package:debugger:prepared]
    sources:
      - '{{.ROOT_DIR}}/.build/clr-anycpu/package-fixtures/debugger.tar'
      - '{{.ROOT_DIR}}/taskfiles/fixtures.yml'
    generates:
