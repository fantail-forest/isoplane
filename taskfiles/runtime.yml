version: '3'

tasks:
  default:
    desc: Prepare the shared runtime, or use explicitly selected modules
    run: once
    cmds:
      - task: '{{if .ISOPLANE_TEST_RUNTIME_MODULES}}modules:available{{else}}modules{{end}}'

  modules:
    desc: Build the shared production and debug WASM runtime modules on Linux
    run: once
    deps: [compiler:selected]
    env:
      ISOPLANE_GUEST_RUNTIME_FEED: '{{.FEED}}'
      ISOPLANE_CLI_ASSEMBLY: '{{.CLI}}'
    sources:
      - '{{.ROOT_DIR}}/tools/BuildProtocol/WasmMemory.props'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/MonoRuntime/{src/**/*,build.sh,manifest.py}'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{Abi,Runtime,Sdk}/**/*.cs'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/AspNetCore/**/*.cs'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{Isoplane.Sdk.csproj,Isoplane.Guest.props,Isoplane.Guest.targets}'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/AspNetCore/{Isoplane.AspNetCore.csproj,buildTransitive/Isoplane.AspNetCore.Framework.targets}'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Build/Isoplane.{Mono*,NativeExports,Validation,Exports}.targets'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Build/Isoplane.Mono.props'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/native/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Conformance/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/build-guest.sh'
      - '{{.ROOT_DIR}}/tools/BuildProtocol/{ManagedApplication,AssemblyClosure,AssetPaths}.cs'
      - '{{.ROOT_DIR}}/licenses/SdkPackage.props'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/global.json'
      - '{{.ROOT_DIR}}/nuget.config'
      - '{{.FEED}}/Isoplane.GuestRuntime.props'
      - exclude: 'guest-sdks/**/{obj,bin,Tests}/**/*'
    generates:
      - '{{.ROOT_DIR}}/.build/wasm32/runtime-modules/Isoplane.MonoRuntime.wasm'
      - '{{.ROOT_DIR}}/.build/wasm32/runtime-modules/Isoplane.MonoRuntime.Debug.wasm'
      - '{{.MODULES}}/runtime.json'
    cmds:
      - 'test "{{OS}}" = linux || { echo "Run task runtime:modules on Linux first." >&2; exit 1; }'
      - task: ':cli'
      - '"{{.PYTHON}}" guest-runtime/feed-identity.py verify-artifact "{{.FEED}}"'
      - 'bash guest-sdks/dotnet/MonoRuntime/build.sh --output "{{.MODULES}}"'

  compiler:selected:
    run: once
    cmds:
      - task: '{{if or .ISOPLANE_TEST_RUNTIME_FEED (ne OS "linux")}}compiler:available{{else}}compiler{{end}}'

  compiler:available:
    internal: true
    preconditions:
      - msg: Prepare the compiler feed with task runtime:compiler on Linux.
        sh: 'test -f "{{.FEED}}/Isoplane.GuestRuntime.props"'
    cmds: []

  modules:available:
    internal: true
    run: once
    preconditions:
      - msg: Prepare the shared runtime with task runtime:modules on Linux.
        sh: 'test -f "{{.MODULES}}/runtime.json" && test -f "{{.MODULES}}/Isoplane.MonoRuntime.wasm" && test -f "{{.MODULES}}/Isoplane.MonoRuntime.Debug.wasm"'
    cmds: []

  compiler:
    desc: Build the Mono compiler packages on Linux
    run: once
    deps: [":initialize", ":setup:workload"]
    sources:
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/src/**/*'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/eng/**/*'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.props'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.targets'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.proj'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.json'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.config'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.sh'
      - '{{.ROOT_DIR}}/vendor/openssl/**/*'
      - '{{.ROOT_DIR}}/vendor/icu/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/*.sh'
      - '{{.ROOT_DIR}}/guest-runtime/manifest.env'
      - '{{.ROOT_DIR}}/global.json'
      - exclude: 'vendor/dotnet-runtime/**/__pycache__/**/*'
    generates:
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/feed/Isoplane.GuestRuntime.props'
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/feed/Microsoft.NETCore.App.Runtime.Mono.wasi-wasm.*.nupkg'
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/feed/Microsoft.NET.Runtime.WebAssembly.Wasi.Sdk.*.nupkg'
    cmds:
      - 'test "{{OS}}" = linux || { echo "Run task runtime:compiler on Linux first." >&2; exit 1; }'
      - task: toolchain
      - task: dependencies
      - 'ISOPLANE_RUNTIME_INPUTS="{{.CHECKSUM}}" bash guest-runtime/build.sh --compile runtime feed'

  dependencies:
    internal: true
    deps: [openssl, icu]

  acquire:
    deps: [':initialize']
    cmds:
      - 'bash guest-runtime/build.sh --compile acquire'

  toolchain:
    run: once
    label: 'runtime:toolchain:{{.PLATFORM}}'
    sources:
      - '{{.ROOT_DIR}}/guest-runtime/manifest.env'
      - '{{.ROOT_DIR}}/guest-runtime/build.sh'
    generates:
      - '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/development/runtime-work/wasi-sdk/VERSION'
    cmds:
      - task: acquire
      - 'bash guest-runtime/build.sh --compile toolchain'

  openssl:
    run: once
    deps: [toolchain]
    sources:
      - '{{.ROOT_DIR}}/vendor/openssl/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/build.sh'
      - '{{.ROOT_DIR}}/guest-runtime/manifest.env'
    generates:
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/openssl/lib/libcrypto.a'
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/openssl/lib/libssl.a'
    cmds:
      - 'bash guest-runtime/build.sh --compile openssl'

  icu:
    run: once
    deps: [toolchain]
    sources:
      - '{{.ROOT_DIR}}/vendor/icu/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/build.sh'
      - '{{.ROOT_DIR}}/guest-runtime/manifest.env'
    generates:
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/icu/mono/runtimes/wasi-wasm/native/lib/icudt.dat'
    cmds:
      - 'bash guest-runtime/build.sh --compile icu'
