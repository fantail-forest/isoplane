version: '3'

tasks:
  selected:
    run: once
    cmds:
      - task: '{{if or .ISOPLANE_TEST_RUNTIME_FEED (ne OS "linux")}}verify-selected{{else}}build{{end}}'

  verify-selected:
    run: once
    internal: true
    cmds:
      - '"{{.PYTHON}}" guest-runtime/feed-identity.py verify-artifact "{{.FEED}}"'

  build:
    run: once
    deps: [":initialize", ":setup:workload"]
    sources:
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/src/**/*'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/eng/**/*'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.props'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.targets'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.proj'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.json'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.config'
      - '{{.ROOT_DIR}}/vendor/dotnet-runtime/*.sh'
      - '{{.ROOT_DIR}}/vendor/openssl/**/*'
      - '{{.ROOT_DIR}}/vendor/icu/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/*.sh'
      - '{{.ROOT_DIR}}/guest-runtime/*.py'
      - '{{.ROOT_DIR}}/guest-runtime/manifest.env'
      - '{{.ROOT_DIR}}/global.json'
      - exclude: 'vendor/dotnet-runtime/**/__pycache__/**/*'
    generates:
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/feed/Isoplane.GuestRuntime.props'
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/feed/Microsoft.NETCore.App.Runtime.Mono.wasi-wasm.*.nupkg'
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/feed/Microsoft.NET.Runtime.WebAssembly.Wasi.Sdk.*.nupkg'
    cmds:
      - 'test "{{OS}}" = linux || { echo "Run task runtime on Linux first." >&2; exit 1; }'
      - task: toolchain
      - task: dependencies
      - 'ISOPLANE_RUNTIME_INPUTS="{{.CHECKSUM}}" bash guest-runtime/build.sh --compile runtime feed'

  runtime:
    cmds:
      - task: build

  feed:
    cmds:
      - task: build

  dependencies:
    internal: true
    deps: [openssl, icu]

  acquire:
    deps: [':initialize']
    cmds:
      - 'bash guest-runtime/build.sh --compile acquire'

  toolchain:
    run: once
    label: 'runtime:toolchain:{{.PLATFORM}}'
    sources:
      - '{{.ROOT_DIR}}/guest-runtime/manifest.env'
      - '{{.ROOT_DIR}}/guest-runtime/build.sh'
    generates:
      - '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/development/runtime-work/wasi-sdk/VERSION'
    cmds:
      - task: acquire
      - 'bash guest-runtime/build.sh --compile toolchain'

  openssl:
    run: once
    deps: [toolchain]
    sources:
      - '{{.ROOT_DIR}}/vendor/openssl/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/build.sh'
      - '{{.ROOT_DIR}}/guest-runtime/manifest.env'
    generates:
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/openssl/lib/libcrypto.a'
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/openssl/lib/libssl.a'
    cmds:
      - 'bash guest-runtime/build.sh --compile openssl'

  icu:
    run: once
    deps: [toolchain]
    sources:
      - '{{.ROOT_DIR}}/vendor/icu/**/*'
      - '{{.ROOT_DIR}}/guest-runtime/build.sh'
      - '{{.ROOT_DIR}}/guest-runtime/manifest.env'
    generates:
      - '{{.ROOT_DIR}}/.build/wasm32/runtime/icu/mono/runtimes/wasi-wasm/native/lib/icudt.dat'
    cmds:
      - 'bash guest-runtime/build.sh --compile icu'
