version: '3'

vars:
  NOTICES: '{{.ROOT_DIR}}/.build/clr-anycpu/notices'

tasks:
  node:
    desc: Collect the standalone host and bundled runtime license notices
    deps: [default]
    sources:
      - '{{.ROOT_DIR}}/Cargo.lock'
      - '{{.ROOT_DIR}}/about.toml'
      - '{{.ROOT_DIR}}/crates/isoplaned/Cargo.toml'
      - '{{.ROOT_DIR}}/taskfiles/notices.yml'
      - '{{.ROOT_DIR}}/Isoplane.Build.slnf'
      - '{{.ROOT_DIR}}/Isoplane.slnx'
    generates: ['{{.NOTICES}}/node-rust-dependencies.json']
    cmds:
      - 'cargo about generate --locked --fail --manifest-path crates/isoplaned/Cargo.toml --target x86_64-unknown-linux-gnu --format json --output-file "{{.NOTICES}}/node-rust-dependencies.json"'

  default:
    run: once
    cmds:
      - task: ':managed:build'
      - task: prepared

  prepared:
    internal: true
    sources:
      - '{{.ROOT_DIR}}/Cargo.lock'
      - '{{.ROOT_DIR}}/about.toml'
      - '{{.MANAGED}}/obj/**/project.assets.json'
      - '{{.ROOT_DIR}}/taskfiles/notices.yml'
      - '{{.ROOT_DIR}}/Isoplane.Build.slnf'
      - '{{.ROOT_DIR}}/Isoplane.slnx'
      - '{{.ROOT_DIR}}/trust/NOTICE'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/MonoRuntime/sqlite/NOTICE'
      - '{{.ROOT_DIR}}/vendor/{dotnet-runtime,icu,openssl}/{LICENSE*,NOTICE*,COPYING*}'
    generates: ['{{.NOTICES}}/rust-dependencies.json', '{{.NOTICES}}/managed-dependencies.json']
    cmds:
      - 'test "{{OS}}" = linux || { echo "Run task release:shared on Linux first." >&2; exit 1; }'
      - task: ':setup:licenses'
      - 'mkdir -p "{{.NOTICES}}"'
      - 'cargo about generate --locked --fail --manifest-path crates/isoplane-native/Cargo.toml --target x86_64-unknown-linux-gnu --target aarch64-apple-darwin --target x86_64-pc-windows-msvc --format json --output-file "{{.NOTICES}}/rust-dependencies.json"'
      - 'jq ".solution.projects" Isoplane.Build.slnf > "{{.NOTICES}}/managed-projects.json"'
      - cmd: '"{{.USER_HOME}}/.dotnet/tools/nuget-license" -ji "{{.NOTICES}}/managed-projects.json" -t -d "{{.NOTICES}}/managed" -o JsonPretty -fo "{{.NOTICES}}/managed-dependencies.json"'
      - |
        for component in dotnet-runtime icu openssl; do
          mkdir -p "{{.NOTICES}}/$component"
          for file in vendor/$component/LICENSE* vendor/$component/NOTICE* vendor/$component/COPYING*; do
            [ ! -f "$file" ] || cp "$file" "{{.NOTICES}}/$component/"
          done
        done
        mkdir -p "{{.NOTICES}}/trust" "{{.NOTICES}}/sqlite"
        cp trust/NOTICE trust/ca-bundle.manifest.json "{{.NOTICES}}/trust/"
        cp guest-sdks/dotnet/MonoRuntime/sqlite/NOTICE "{{.NOTICES}}/sqlite/"
    env:
      ArtifactsPath: '{{.MANAGED}}'
