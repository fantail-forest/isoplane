version: '3'

vars:
  RELEASES: '{{.ROOT_DIR}}/.build/releases'
  NOTICES: '{{.ROOT_DIR}}/.build/clr-anycpu/notices'
  NATIVE_PACKAGES: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/release-packages'

tasks:
  editor:
    desc: Package the Isoplane VS Code extension
    deps: [':test:editor:environment']
    cmds:
      - npm --prefix tools/vscode-isoplane run package

  shared:
    run: once
    desc: Prepare platform-independent release inputs on Linux, or check a copied set with ISOPLANE_RELEASE_SHARED=copied
    cmds:
      - task: 'shared:{{if and (eq OS "linux") (ne (.ISOPLANE_RELEASE_SHARED | default "") "copied")}}build{{else}}available{{end}}'

  shared:build:
    internal: true
    cmds:
      # The packages compile and carry generated files, so generate them first. Building the
      # native library writes its C# declarations.
      - task: native-library
      - task: ':generate:abi'
      - task: ':generate:reference'
      - task: ':managed:packages'
      - task: ':notices:prepared'
      - task: shared:validate
        vars: {MODE: write}

  unmodified:
    desc: Fail if the working tree differs from its commit, as it does once code generation has found stale files
    silent: true
    cmds:
      # The flags fix what status reports whatever the user's Git configuration says. A submodule
      # counts when it is at another commit than the pinned one, not for files a build left in it.
      - |
        changed="$(git status --porcelain --untracked-files=all --ignore-submodules=dirty)"
        if [ -n "$changed" ]; then
          echo "The working tree differs from its commit after code generation, so the commit's generated files were stale or the tree was not clean to begin with. Run 'task generate', commit the result and release that commit." >&2
          echo "$changed" >&2
          exit 1
        fi

  shared:available:
    internal: true
    cmds:
      - task: shared:validate
        vars: {MODE: read}

  shared:validate:
    internal: true
    label: 'release:shared:validate:{{.MODE}}'
    deps: [':initialize']
    requires:
      vars: [MODE]
    vars:
      VERSION: &version
        sh: '"{{.DOTNET}}" msbuild Directory.Build.props -nologo -getProperty:Version'
    cmds:
      - '"{{.PYTHON}}" -B scripts/release-manifest.py shared "{{.ROOT_DIR}}" --packages "{{.PACKAGES}}" --managed "{{.MANAGED}}" --notices "{{.NOTICES}}" --version {{.VERSION}} --revision {{.REVISION}} {{if eq .MODE "write"}}--write{{end}}'

  default:
    label: 'release:{{.PLATFORM}}:{{.VERSION}}:{{.RELEASES}}'
    desc: Assemble this platform's prepared NuGet packages
    deps: [shared, native-packages]
    vars:
      VERSION: *version
      RELEASE: '{{.RELEASES}}/isoplane-{{.PLATFORM}}-{{.VERSION}}'
    sources:
      - '{{.PACKAGES}}/*.{{.VERSION}}.nupkg'
      - '{{.NATIVE_PACKAGES}}/*.{{.VERSION}}.nupkg'
      - '{{.ROOT_DIR}}/taskfiles/release.yml'
      - '{{.ROOT_DIR}}/taskfiles/Release.proj'
      - '{{.ROOT_DIR}}/scripts/release-manifest.py'
      - '{{.ROOT_DIR}}/scripts/release_packages.py'
      - '{{.ROOT_DIR}}/scripts/developer-preview-readme.md'
      - '{{.SOURCE_REF}}'
    generates:
      - '{{.RELEASE}}/release.json'
      - '{{.RELEASE}}/README.md'
    cmds:
      - '"{{.DOTNET}}" msbuild taskfiles/Release.proj -nologo -t:StageRelease -p:Version={{.VERSION}} -p:SharedPackages="{{.PACKAGES}}" -p:NativePackages="{{.NATIVE_PACKAGES}}" -p:ReleaseDirectory="{{.RELEASE}}"'
      - '"{{.PYTHON}}" -B scripts/release-manifest.py release "{{.RELEASE}}" --platform {{.PLATFORM}} --version {{.VERSION}} --revision {{.REVISION}}'
      - |
        sed -e 's/@PACKAGE_VERSION@/{{.VERSION}}/g' -e 's/@RUNTIME_IDENTIFIER@/{{.PLATFORM}}/g' \
          -e 's|@SDK_PREREQUISITES@|Install the .NET 10 SDK. On Ubuntu 24.04:\n\nsudo apt-get install -y dotnet-sdk-10.0|' \
          scripts/developer-preview-readme.md > "{{.RELEASE}}/README.md"

  native-packages:
    internal: true
    run: once
    deps: [shared, native-library]
    cmds:
      - task: ':managed:pack-native'
        vars:
          OUTPUT: '{{.NATIVE_PACKAGES}}'
          PACKAGE_NOTICES: '{{.NOTICES}}'

  native-library:
    internal: true
    run: once
    cmds:
      - task: 'native-library:{{if .ISOPLANE_RELEASE_NATIVE_ROOT}}available{{else}}build{{end}}'

  native-library:build:
    internal: true
    cmds:
      - task: ':native:release'

  native-library:available:
    internal: true
    preconditions:
      - sh: test -f "{{.RELEASE_NATIVE_LIBRARY}}"
        msg: 'ISOPLANE_RELEASE_NATIVE_ROOT is set, so the native library is packed as provided and not built, but {{.RELEASE_NATIVE_LIBRARY}} does not exist.'

  forks:
    desc: Check that each pinned fork commit has a release holding its build outputs
    cmds:
      - bash scripts/check-fork-releases

  publication:
    desc: Pack the publication feed once each pinned fork commit has a release
    deps: [forks]
    cmds:
      - task: feed

  feed:
    desc: Pack one package feed with native libraries from all three platforms
    vars:
      VERSION: *version
      PACKAGE_FEED: &package_feed '{{.RELEASES}}/publication-{{.VERSION}}/nuget/{{.VERSION}}'
    cmds:
      - task: feed:pack
      - '"{{.PYTHON}}" -B scripts/verify-release-feed.py --releases "{{.RELEASES}}" --version {{.VERSION}} --feed "{{.PACKAGE_FEED}}"'

  feed:pack:
    internal: true
    deps: [shared]
    vars:
      VERSION: *version
      PACKAGE_FEED: *package_feed
    sources:
      - '{{.PACKAGES}}/*.{{.VERSION}}.nupkg'
      - '{{.MANAGED}}/publish/Isoplane.Cli/release/**/*'
      - '{{.MANAGED}}/bin/Isoplane.Native/release/*'
      - '{{.RELEASE_NATIVE_ROOT}}/*/native/release/*isoplane_native*'
      - '{{.ROOT_DIR}}/taskfiles/NativePackages/**/*'
      - '{{.ROOT_DIR}}/taskfiles/NativeAssets.props'
      - '{{.ROOT_DIR}}/taskfiles/release.yml'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/licenses/**/*'
      - '{{.NOTICES}}/**/*'
      - '{{.ROOT_DIR}}/tools/{Isoplane.Cli,Isoplane.Native}/README.md'
    generates:
      - '{{.PACKAGE_FEED}}/*.{{.VERSION}}.nupkg'
    cmds:
      - 'mkdir -p "{{.PACKAGE_FEED}}"'
      - for: [Isoplane.Native, Isoplane.Cli]
        cmd: '"{{.DOTNET}}" msbuild taskfiles/NativePackages/NativePackages.csproj -restore -t:Pack -p:NoBuild=true -p:Configuration=Release -p:ArtifactsPath="{{.ROOT_DIR}}/.build/{{.PLATFORM}}/publication/{{.ITEM}}" -p:PackageOutputPath="{{.PACKAGE_FEED}}" -p:PackageId={{.ITEM}} -p:ManagedDirectory="{{.MANAGED}}" -p:IsoplaneNativeRoot="{{.RELEASE_NATIVE_ROOT}}" -p:NoticesDirectory="{{.NOTICES}}"'
      - 'cp "{{.PACKAGES}}"/*.{{.VERSION}}.nupkg "{{.PACKAGE_FEED}}/"'
