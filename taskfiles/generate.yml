version: '3'

# The generators of committed files. The pre-commit hook runs them all.
tasks:
  default:
    desc: Regenerate every committed file that is generated from another source
    cmds:
      - task: abi
      - task: native-bindings
      - task: reference

  abi:
    desc: Generate the C headers the SDK takes from the host interface
    deps: [':initialize']
    cmds:
      # Compiling first leaves the committed files alone when the crate does not build.
      - '{{.DEVELOPMENT_COMMAND}}cargo build --quiet --locked -p isoplane-abi --example filesystem_header --example local_debug_header --example native_io_header'
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet --locked -p isoplane-abi --example filesystem_header > guest-sdks/dotnet/native/isoplane_filesystem.h'
      # This example writes guest-sdks/dotnet/native/isoplane_local_debug.h itself.
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet --locked -p isoplane-abi --example local_debug_header'
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet --locked -p isoplane-abi --example native_io_header > guest-sdks/dotnet/native/isoplane_native_io.h'

  native-bindings:
    desc: Generate the C# declarations of the native library's C interface
    deps: [':initialize']
    env:
      CARGO_TARGET_DIR: '{{.NATIVE_TARGET}}'
      CARGO_BUILD_BUILD_DIR: '{{.NATIVE_TARGET}}'
      ISOPLANE_GENERATE_BINDINGS: '1'
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo build --quiet --locked -p isoplane-native'

  reference:
    desc: Generate the customer reference pages from the SDK, the CLI and the build files
    cmds:
      - task: ':managed:reference'
