version: '3'

# The generators of committed files. The pre-commit hook runs them all.
tasks:
  default:
    desc: Regenerate every committed file that is generated from another source
    cmds:
      - task: abi
      - task: native-bindings
      - task: reference

  abi:
    desc: Generate the C headers and the C# types the SDK takes from the host interface
    deps: [':initialize']
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet --locked -p isoplane-abi --example csharp_contract'
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet --locked -p isoplane-abi --example filesystem_header'
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet --locked -p isoplane-abi --example imports_header'
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet --locked -p isoplane-abi --example local_debug_header'
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet --locked -p isoplane-abi --example native_io_header'

  native-bindings:
    desc: Generate the C# declarations of the native library's C interface
    deps: [':initialize']
    cmds:
      # This example writes tools/Isoplane.Native/NativeMethods.g.cs itself.
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet --locked -p isoplane-native --example csharp_bindings'

  reference:
    desc: Generate the customer reference pages from the SDK, the CLI and the build files
    cmds:
      - task: ':managed:reference'
