version: '3'

tasks:
  build:
    desc: Build portable managed tools and SDK assemblies
    cmds:
      - task: compile
        vars: {FILTER: Isoplane.Build.slnf}
      - task: publish-cli

  tests:
    desc: Build managed tools and test assemblies
    cmds:
      - task: compile
        vars: {FILTER: Isoplane.Tests.slnf}
      - task: publish-cli

  guest-fixtures:
    desc: Build the managed applications used by Rust integration tests
    cmds:
      - task: ':runtime'
      - task: compile
        vars: {FILTER: '{{.FILTER | default "Isoplane.Fixtures.slnf"}}'}
      - task: publish-cli

  all-tests:
    desc: Build managed tools, tests and guest applications in one graph
    cmds:
      - task: ':runtime'
      - task: compile
        vars: {FILTER: Isoplane.AllTests.slnf}
      - task: publish-cli

  compile:
    internal: true
    label: 'managed:compile:{{.FILTER}}'
    deps: [':initialize']
    requires:
      vars: [FILTER]
    env:
      ISOPLANE_GUEST_RUNTIME_FEED: '{{.FEED}}'
      ISOPLANE_SQLITE_DIRECTORY: '{{.ROOT_DIR}}/.build/wasm32/runtime/sqlite'
    cmds:
      - '"{{.DOTNET}}" build "{{.FILTER}}" -c Release -p:ShouldUnsetParentConfigurationAndPlatform=false -p:SourceRevisionId={{.REVISION}} -p:IsoplaneManagedOnly=true {{.MSBUILD_ARGS}}'
      - task: executable-assemblies

  publish-cli:
    internal: true
    cmds:
      - '"{{.DOTNET}}" msbuild tools/Isoplane.Cli/Isoplane.Cli.csproj -t:Publish,GenerateToolsSettingsFileFromBuildProperty -p:Configuration=Release -p:NoBuild=true -p:BuildProjectReferences=false -p:IsoplaneManagedOnly=true'
      - task: executable-assemblies

  executable-assemblies:
    internal: true
    cmds:
      # Windows loads PE images with execute access, including over SMB.
      - 'find "{{.MANAGED}}" -type f -name "*.dll" ! -perm -a=x -exec chmod a+x {} +'

  reference:
    desc: Generate the customer reference documentation
    cmds:
      - task: compile
        vars: {FILTER: Isoplane.Docs.slnf}
      - 'cd docs/userdocs && "{{.DOTNET}}" "{{.MANAGED}}/bin/ApiReference/release/ApiReference.dll" docs/reference --since since.json {{.CLI_ARGS}}'

  packages:
    run: once
    desc: Pack the prepared managed assemblies and shared runtime
    cmds:
      - task: ':runtime'
      - task: compile
        vars: {FILTER: Isoplane.Packages.slnf}
      - task: publish-cli
      - task: packages:prepared

  packages:prepared:
    internal: true
    run: once
    deps: [template-package:prepared]

  sdk-packages:prepared:
    internal: true
    run: once
    deps: [':runtime']
    sources:
      - '{{.MANAGED}}/bin/{Isoplane.Sdk,Isoplane.AspNetCore,Isoplane.AspNetCore.DataProtection.EntityFrameworkCore,Isoplane.OpenTelemetry,Isoplane.Testing,Conformance,Isoplane.Analyzers,Isoplane.Analyzers.CodeFixes}/release/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Build/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{Analyzers,Conformance}/Pack.targets'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/MSBuild/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{AspNetCore,OpenTelemetry,AspNetCore.DataProtection.EntityFrameworkCore}/buildTransitive/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{buildTransitive,Skill}/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/AspNetCore/Sdk/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{Isoplane.Sdk,AspNetCore/Isoplane.AspNetCore,AspNetCore.DataProtection.EntityFrameworkCore/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore,OpenTelemetry/Isoplane.OpenTelemetry}.csproj'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{PackageReadme.md,AspNetCore/PackageReadme.md,AspNetCore.DataProtection.EntityFrameworkCore/PackageReadme.md,OpenTelemetry/PackageReadme.md}'
      - '{{.ROOT_DIR}}/tools/Isoplane.Testing/{Isoplane.Testing.csproj,PackageReadme.md}'
      - '{{.ROOT_DIR}}/licenses/SdkPackage.props'
      - '{{.ROOT_DIR}}/licenses/Isoplane-SDK-LICENSE.txt'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/taskfiles/managed.yml'
      - '{{.ROOT_DIR}}/taskfiles/NativeAssets.props'
      - '{{.MODULES}}/*.wasm'
      - '{{.MODULES}}/runtime.json'
      - '{{.MODULES}}/native-imports.txt'
    generates:
      - '{{.PACKAGES}}/Isoplane.Sdk.*.nupkg'
      - '{{.PACKAGES}}/Isoplane.AspNetCore.*.nupkg'
      - '{{.PACKAGES}}/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore.*.nupkg'
      - '{{.PACKAGES}}/Isoplane.OpenTelemetry.*.nupkg'
      - '{{.PACKAGES}}/Isoplane.Testing.*.nupkg'
    cmds:
      - 'test "{{OS}}" = linux || { echo "Run task managed:packages on Linux first." >&2; exit 1; }'
      - task: pack-shared

  pack-shared:
    internal: true
    deps:
      - for:
          - guest-sdks/dotnet/Isoplane.Sdk.csproj
          - guest-sdks/dotnet/AspNetCore/Isoplane.AspNetCore.csproj
          - guest-sdks/dotnet/AspNetCore.DataProtection.EntityFrameworkCore/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore.csproj
          - guest-sdks/dotnet/OpenTelemetry/Isoplane.OpenTelemetry.csproj
          - tools/Isoplane.Testing/Isoplane.Testing.csproj
        task: pack
        vars:
          PROJECT: '{{.ITEM}}'

  template-package:prepared:
    internal: true
    run: once
    deps: [sdk-packages:prepared, ':cli:stage']
    vars:
      WORK: '{{.ROOT_DIR}}/.build/clr-anycpu/template-skills-work'
    sources:
      - '{{.SOURCE_REF}}'
      - '{{.PACKAGES}}/Isoplane.{Sdk,AspNetCore,AspNetCore.DataProtection.EntityFrameworkCore,OpenTelemetry}.*.nupkg'
      - '{{.MANAGED}}/bin/Isoplane.Cli/release/*'
      - '{{.MANAGED}}/bin/Isoplane.Templates/release/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Templates/**/*'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/licenses/SdkPackage.props'
      - '{{.ROOT_DIR}}/licenses/Isoplane-SDK-LICENSE.txt'
      - '{{.ROOT_DIR}}/taskfiles/managed.yml'
    generates:
      - '{{.PACKAGES}}/Isoplane.Templates.*.nupkg'
    cmds:
      - rm -rf "{{.TEMPLATE_SKILLS}}" "{{.WORK}}"
      - mkdir -p "{{.WORK}}"
      # Isoplane packages come only from this build: nuget.org carries the same version.
      - |
        cat > "{{.WORK}}/nuget.config" <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            <add key="isoplane" value="{{.PACKAGES}}" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="isoplane"><package pattern="Isoplane.*" /></packageSource>
            <packageSource key="nuget"><package pattern="*" /></packageSource>
          </packageSourceMapping>
        </configuration>
        EOF
      # Each template ships the skill `isoplane skills install` writes for the project it creates.
      # The template is created as DIRECTORY:NAME from a copy that holds the empty skill directory
      # its definition names, and the packages are extracted afresh, because NuGet never extracts
      # an id and version it already holds.
      - for: ['web:isoplane-web', 'handler:isoplane-handler', 'mcpserver:isoplane-mcpserver', 'webapi:isoplane-webapi', 'webapp:isoplane-webapp']
        cmd: |
          set -e
          content="{{.WORK}}/content/{{index (splitList ":" .ITEM) 0}}"
          project="{{.WORK}}/projects/{{index (splitList ":" .ITEM) 0}}"
          mkdir -p "{{.WORK}}/content"
          cp -R "guest-sdks/dotnet/Templates/content/{{index (splitList ":" .ITEM) 0}}" "$content"
          find "$content" \( -name bin -o -name obj -o -name .isoplane \) -prune -exec rm -rf {} +
          mkdir -p "$content/.template.config/skills/isoplane"
          "{{.DOTNET}}" new install "$content" --debug:custom-hive "{{.WORK}}/hive"
          "{{.DOTNET}}" new {{index (splitList ":" .ITEM) 1}} --name App --dot-agents false --dot-claude false --output "$project" --debug:custom-hive "{{.WORK}}/hive"
          cp "{{.WORK}}/nuget.config" "$project/"
          NUGET_PACKAGES="{{.WORK}}/packages" "{{.DOTNET}}" "{{.CLI}}" skills install --project "$(dirname "$(find "$project" -name App.csproj)")" --skills-path "{{.TEMPLATE_SKILLS}}/{{index (splitList ":" .ITEM) 0}}/.template.config/skills"
      - task: pack
        vars:
          PROJECT: guest-sdks/dotnet/Templates/Isoplane.Templates.csproj

  pack:
    internal: true
    label: 'pack:{{.PROJECT}}'
    cmds:
      - '"{{.DOTNET}}" pack "{{.PROJECT}}" -c Release --no-build --artifacts-path "{{.MANAGED}}" -o "{{.PACKAGES}}" -p:IsoplaneManagedOnly=true -p:UseAppHost=false -p:IsoplaneRuntimeModuleDirectory="{{.MODULES}}" -p:IsoplaneTemplateSkillDirectory="{{.TEMPLATE_SKILLS}}"'


  native-packages:
    run: once
    desc: Pack this platform's CLI and native packages for tests, without dependency notices
    cmds:
      - task: build
      - task: native-packages:prepared

  native-packages:prepared:
    internal: true
    run: once
    deps: [':native:release']
    cmds:
      - task: pack-native
        vars:
          OUTPUT: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/packages'

  pack-native:
    internal: true
    label: 'pack-native:{{.OUTPUT}}'
    requires:
      vars: [OUTPUT]
    sources:
      - '{{.MANAGED}}/publish/Isoplane.Cli/release/**/*'
      - '{{.MANAGED}}/bin/Isoplane.Native/release/*'
      - '{{.RELEASE_NATIVE_LIBRARY}}'
      - '{{if .PACKAGE_NOTICES}}{{.PACKAGE_NOTICES}}/**/*{{end}}'
      - '{{.ROOT_DIR}}/taskfiles/NativePackages/**/*'
      - '{{.ROOT_DIR}}/tools/{Isoplane.Cli,Isoplane.Native}/README.md'
      - '{{.ROOT_DIR}}/licenses/SdkPackage.props'
      - '{{.ROOT_DIR}}/licenses/Isoplane-SDK-LICENSE.txt'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/taskfiles/managed.yml'
      - '{{.ROOT_DIR}}/taskfiles/NativeAssets.props'
    generates:
      - '{{.OUTPUT}}/Isoplane.Cli.*.nupkg'
      - '{{.OUTPUT}}/Isoplane.Native.*.nupkg'
    cmds:
      - for: [Isoplane.Native, Isoplane.Cli]
        cmd: '"{{.DOTNET}}" msbuild taskfiles/NativePackages/NativePackages.csproj -restore -t:Pack -p:NoBuild=true -p:Configuration=Release -p:ArtifactsPath="{{.OUTPUT}}/intermediates/{{.ITEM}}" -p:PackageOutputPath="{{.OUTPUT}}" -p:PackageId={{.ITEM}} -p:ManagedDirectory="{{.MANAGED}}" -p:IsoplaneNativePath="{{.RELEASE_NATIVE_LIBRARY}}" -p:IsoplaneNativeRid={{.PLATFORM}} -p:NoticesDirectory="{{.PACKAGE_NOTICES}}"'
