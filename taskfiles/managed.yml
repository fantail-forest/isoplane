version: '3'

tasks:
  build:
    run: once
    desc: Build portable managed tools and SDK assemblies on Linux
    deps: [":initialize"]
    sources: &managed_sources
      - '{{.SOURCE_REF}}'
      - '{{.ROOT_DIR}}/tools/**/*.cs'
      - '{{.ROOT_DIR}}/tools/**/*.csproj'
      - '{{.ROOT_DIR}}/tools/**/*.props'
      - '{{.ROOT_DIR}}/tools/**/*.targets'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/**/*.cs'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/**/*.csproj'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/**/*.props'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/**/*.targets'
      - '{{.ROOT_DIR}}/Isoplane.slnx'
      - '{{.ROOT_DIR}}/Isoplane.Build.slnf'
      - '{{.ROOT_DIR}}/taskfiles/managed.yml'
      - '{{.ROOT_DIR}}/taskfiles/NativeAssets.props'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/global.json'
      - '{{.ROOT_DIR}}/nuget.config'
      - '{{.ROOT_DIR}}/licenses/SdkPackage.props'
      - exclude: 'tools/**/{obj,bin}/**/*'
      - exclude: 'guest-sdks/dotnet/**/{obj,bin}/**/*'
    generates:
      - '{{.CLI}}'
      - '{{.MANAGED}}/bin/Isoplane.Sdk/release/Isoplane.Sdk.dll'
      - '{{.MANAGED}}/bin/Isoplane.AspNetCore/release/Isoplane.AspNetCore.dll'
      - '{{.MANAGED}}/bin/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore/release/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore.dll'
      - '{{.MANAGED}}/bin/Isoplane.OpenTelemetry/release/Isoplane.OpenTelemetry.dll'
      - '{{.MANAGED}}/bin/Isoplane.Testing/release/Isoplane.Testing.dll'
      - '{{.MANAGED}}/publish/Isoplane.Cli/release/Isoplane.Cli.dll'
      - '{{.MANAGED}}/obj/Isoplane.Cli/release/DotnetToolSettings.xml'
      - '{{.MANAGED}}/bin/Isoplane.Cli/release/hotreload/Isoplane.HotReload.dll'
      - '{{.MANAGED}}/bin/Isoplane.Cli/release/hotreload/Isoplane.HotReload.deps.json'
      - '{{.MANAGED}}/bin/Isoplane.Cli/release/hotreload/Isoplane.HotReload.runtimeconfig.json'
      - '{{.MANAGED}}/publish/Isoplane.Cli/release/hotreload/Isoplane.HotReload.dll'
      - '{{.MANAGED}}/publish/Isoplane.Cli/release/hotreload/Isoplane.HotReload.deps.json'
      - '{{.MANAGED}}/publish/Isoplane.Cli/release/hotreload/Isoplane.HotReload.runtimeconfig.json'
    cmds:
      - 'test "{{OS}}" = linux || { echo "Run task managed:build on Linux first." >&2; exit 1; }'
      - '"{{.DOTNET}}" build Isoplane.Build.slnf -c Release -p:ShouldUnsetParentConfigurationAndPlatform=false -p:SourceRevisionId={{.REVISION}} --artifacts-path "{{.MANAGED}}" -p:IsoplaneManagedOnly=true -p:UseAppHost=false'
      - '"{{.DOTNET}}" msbuild tools/Isoplane.Cli/Isoplane.Cli.csproj -t:Publish,GenerateToolsSettingsFileFromBuildProperty -p:Configuration=Release -p:NoBuild=true -p:ArtifactsPath="{{.MANAGED}}" -p:IsoplaneManagedOnly=true -p:UseAppHost=false'
      - task: executable-assemblies

  tests:
    run: once
    desc: Build managed test assemblies on Linux
    deps: [build]
    sources: *managed_sources
    generates:
      - '{{.MANAGED}}/bin/Isoplane.Cli.Tests/release/Isoplane.Cli.Tests.dll'
      - '{{.MANAGED}}/bin/Isoplane.Debugging.Tests/release/Isoplane.Debugging.Tests.dll'
      - '{{.MANAGED}}/bin/Isoplane.Debugging.Tests/release/hotreload/Isoplane.HotReload.dll'
      - '{{.MANAGED}}/bin/Isoplane.Debugging.Tests/release/hotreload/Isoplane.HotReload.deps.json'
      - '{{.MANAGED}}/bin/Isoplane.Debugging.Tests/release/hotreload/Isoplane.HotReload.runtimeconfig.json'
      - '{{.MANAGED}}/bin/Isoplane.Testing.Tests/release/Isoplane.Testing.Tests.dll'
      - '{{.MANAGED}}/bin/Build.Tests/release/Build.Tests.dll'
      - '{{.MANAGED}}/bin/Isoplane.AspNetCore.Tests/release/Isoplane.AspNetCore.Tests.dll'
      - '{{.MANAGED}}/bin/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore.Tests/release/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore.Tests.dll'
      - '{{.MANAGED}}/bin/Isoplane.OpenTelemetry.Tests/release/Isoplane.OpenTelemetry.Tests.dll'
      - '{{.MANAGED}}/bin/Isoplane.Analyzers.Tests/release/Isoplane.Analyzers.Tests.dll'
    cmds:
      - 'test "{{OS}}" = linux || { echo "Run task managed:tests on Linux first." >&2; exit 1; }'
      - '"{{.DOTNET}}" build Isoplane.slnx -c Release -p:ShouldUnsetParentConfigurationAndPlatform=false -p:SourceRevisionId={{.REVISION}} --artifacts-path "{{.MANAGED}}" -p:IsoplaneManagedOnly=true -p:UseAppHost=false'
      - task: executable-assemblies

  executable-assemblies:
    internal: true
    cmds:
      # Windows loads PE images with execute access, including over SMB.
      - 'find "{{.MANAGED}}" -type f -name "*.dll" ! -perm -a=x -exec chmod a+x {} +'

  skill:
    run: once
    desc: Lay out the isoplane agent skill the SDK packages carry, from the customer docs
    deps: [build]
    sources:
      - '{{.ROOT_DIR}}/docs/userdocs/docs/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Skill/**/*'
      - '{{.ROOT_DIR}}/tools/ApiReference/**/*.cs'
      - exclude: 'docs/userdocs/docs/**/{obj,bin}/**/*'
    generates:
      - '{{.SKILL}}/SKILL.md'
    cmds:
      - '"{{.DOTNET}}" run --project tools/ApiReference -c Release -p:IsoplaneManagedOnly=true --artifacts-path "{{.MANAGED}}" -- skill-references --docs docs/userdocs/docs --skill guest-sdks/dotnet/Skill --out "{{.SKILL}}"'

  packages:
    run: once
    desc: Pack the prepared managed assemblies and shared runtime
    deps:
      - build
      - skill
      - template-package
      - ':runtime'
    sources:
      - '{{.SKILL}}/**/*'
      - '{{.MANAGED}}/bin/{Isoplane.Sdk,Isoplane.AspNetCore,Isoplane.AspNetCore.DataProtection.EntityFrameworkCore,Isoplane.OpenTelemetry,Isoplane.Templates,Isoplane.Testing,Conformance}/release/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Build/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/MSBuild/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{AspNetCore,OpenTelemetry,AspNetCore.DataProtection.EntityFrameworkCore}/buildTransitive/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{buildTransitive,Skill}/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/AspNetCore/Sdk/**/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{Isoplane.Sdk,AspNetCore/Isoplane.AspNetCore,AspNetCore.DataProtection.EntityFrameworkCore/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore,OpenTelemetry/Isoplane.OpenTelemetry,Templates/Isoplane.Templates}.csproj'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/{PackageReadme.md,AspNetCore/README.md,AspNetCore.DataProtection.EntityFrameworkCore/PackageReadme.md,OpenTelemetry/PackageReadme.md}'
      - '{{.ROOT_DIR}}/tools/Isoplane.Testing/{Isoplane.Testing.csproj,README.md}'
      - '{{.ROOT_DIR}}/licenses/SdkPackage.props'
      - '{{.ROOT_DIR}}/licenses/Isoplane-SDK-LICENSE.txt'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Templates/content/**/*'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/taskfiles/managed.yml'
      - '{{.ROOT_DIR}}/taskfiles/NativeAssets.props'
      - '{{.MODULES}}/*.wasm'
      - '{{.MODULES}}/runtime.json'
    generates:
      - '{{.PACKAGES}}/Isoplane.Sdk.*.nupkg'
      - '{{.PACKAGES}}/Isoplane.AspNetCore.*.nupkg'
      - '{{.PACKAGES}}/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore.*.nupkg'
      - '{{.PACKAGES}}/Isoplane.OpenTelemetry.*.nupkg'
      - '{{.PACKAGES}}/Isoplane.Templates.*.nupkg'
      - '{{.PACKAGES}}/Isoplane.Testing.*.nupkg'
    cmds:
      - 'test "{{OS}}" = linux || { echo "Run task managed:packages on Linux first." >&2; exit 1; }'
      - task: pack-shared

  pack-shared:
    internal: true
    deps:
      - for:
          - guest-sdks/dotnet/Isoplane.Sdk.csproj
          - guest-sdks/dotnet/AspNetCore/Isoplane.AspNetCore.csproj
          - guest-sdks/dotnet/AspNetCore.DataProtection.EntityFrameworkCore/Isoplane.AspNetCore.DataProtection.EntityFrameworkCore.csproj
          - guest-sdks/dotnet/OpenTelemetry/Isoplane.OpenTelemetry.csproj
          - tools/Isoplane.Testing/Isoplane.Testing.csproj
        task: pack
        vars:
          PROJECT: '{{.ITEM}}'

  template-package:
    run: once
    desc: Pack the prepared application templates without building the guest runtime
    deps: [build]
    sources:
      - '{{.MANAGED}}/bin/Isoplane.Templates/release/*'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Templates/**/*'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/licenses/SdkPackage.props'
      - '{{.ROOT_DIR}}/licenses/Isoplane-SDK-LICENSE.txt'
      - '{{.ROOT_DIR}}/taskfiles/managed.yml'
    generates:
      - '{{.PACKAGES}}/Isoplane.Templates.*.nupkg'
    cmds:
      - task: pack
        vars:
          PROJECT: guest-sdks/dotnet/Templates/Isoplane.Templates.csproj

  pack:
    internal: true
    label: 'pack:{{.PROJECT}}'
    cmds:
      - '"{{.DOTNET}}" pack "{{.PROJECT}}" -c Release --no-build --artifacts-path "{{.MANAGED}}" -o "{{.PACKAGES}}" -p:IsoplaneManagedOnly=true -p:UseAppHost=false -p:IsoplaneRuntimeModuleDirectory="{{.MODULES}}" -p:IsoplaneSkillDirectory="{{.SKILL}}"'


  native-packages:
    run: once
    desc: Pack this platform's CLI and native packages for tests, without dependency notices
    deps: [build, ':native:release']
    cmds:
      - task: pack-native
        vars:
          OUTPUT: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/packages'

  pack-native:
    internal: true
    label: 'pack-native:{{.OUTPUT}}'
    requires:
      vars: [OUTPUT]
    sources:
      - '{{.MANAGED}}/publish/Isoplane.Cli/release/**/*'
      - '{{.MANAGED}}/bin/Isoplane.Native/release/*'
      - '{{.RELEASE_NATIVE_LIBRARY}}'
      - '{{if .PACKAGE_NOTICES}}{{.PACKAGE_NOTICES}}/**/*{{end}}'
      - '{{.ROOT_DIR}}/taskfiles/NativePackages/**/*'
      - '{{.ROOT_DIR}}/tools/{Isoplane.Cli,Isoplane.Native}/README.md'
      - '{{.ROOT_DIR}}/licenses/SdkPackage.props'
      - '{{.ROOT_DIR}}/licenses/Isoplane-SDK-LICENSE.txt'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/taskfiles/managed.yml'
      - '{{.ROOT_DIR}}/taskfiles/NativeAssets.props'
    generates:
      - '{{.OUTPUT}}/Isoplane.Cli.*.nupkg'
      - '{{.OUTPUT}}/Isoplane.Native.*.nupkg'
    cmds:
      - for: [Isoplane.Native, Isoplane.Cli]
        cmd: '"{{.DOTNET}}" msbuild taskfiles/NativePackages/NativePackages.csproj -restore -t:Pack -p:NoBuild=true -p:Configuration=Release -p:ArtifactsPath="{{.OUTPUT}}/intermediates/{{.ITEM}}" -p:PackageOutputPath="{{.OUTPUT}}" -p:PackageId={{.ITEM}} -p:ManagedDirectory="{{.MANAGED}}" -p:IsoplaneNativePath="{{.RELEASE_NATIVE_LIBRARY}}" -p:IsoplaneNativeRid={{.PLATFORM}} -p:NoticesDirectory="{{.PACKAGE_NOTICES}}"'
