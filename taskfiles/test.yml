version: '3'

tasks:
  default:
    desc: Prepare fixtures, then run the Rust test suite
    deps: [':initialize', ':fixtures']
    cmds:
      - 'cargo test --workspace {{.CLI_ARGS}}'

  unit:
    desc: Run Rust library tests without preparing integration fixtures
    deps: [':initialize']
    cmds:
      - 'cargo test --lib {{.CLI_ARGS}}'

  rust:
    desc: Prepare Rust WASM fixtures and run selected Rust tests
    deps: [':initialize', ':fixtures:rust']
    cmds:
      - 'cargo test {{.CLI_ARGS}}'

  runtime:
    desc: Run shared runtime acceptance tests
    deps: [':initialize', ':fixtures:acceptance']
    cmds:
      - 'cargo test -p isoplane-runtime-acceptance {{.CLI_ARGS}}'

  native:
    desc: Run SDK and CLI integration tests using prepared packages
    deps: [':initialize', ':cli', ':fixtures:feed', ':fixtures:package', ':managed:tests', ':test:debugger:environment', ':test:debugger:host']
    cmds:
      - 'cargo test -p isoplane-native {{.CLI_ARGS}}'

  debugger:
    desc: Run selected native debugger integration tests
    deps: [':initialize', ':cli', ':managed:tests', ':test:debugger:environment', ':fixtures:feed', ':fixtures:package:debugger', ':fixtures:package:debugger-optimized', ':test:debugger:host']
    cmds:
      - 'cargo test -p isoplane-native --test installed_dev {{.CLI_ARGS}}'

  managed:
    desc: Run the managed CLI and debugger tests using prepared assemblies
    deps: [':managed:tests', ':native']
    cmds:
      - '"{{.DOTNET}}" msbuild taskfiles/StageCli.proj -nologo -p:NativeLibrary="{{.NATIVE_TARGET}}/debug/{{.NATIVE_LIBRARY}}" -p:CliDirectory="{{.MANAGED}}/bin/Isoplane.Cli.Tests/release" -p:Platform={{.PLATFORM}}'
      - '"{{.DOTNET}}" test tools/Isoplane.Cli.Tests/Isoplane.Cli.Tests.csproj -c Release --no-build --artifacts-path "{{.MANAGED}}" {{.CLI_ARGS}}'
      - '"{{.DOTNET}}" test tools/Isoplane.Debugging.Tests/Isoplane.Debugging.Tests.csproj -c Release --no-build --artifacts-path "{{.MANAGED}}" {{.CLI_ARGS}}'

  debugger:host:
    deps: [':managed:tests', ':native:release']
    cmds:
      - '"{{.DOTNET}}" msbuild taskfiles/StageCli.proj -nologo -p:NativeLibrary="{{.NATIVE_TARGET}}/release/{{.NATIVE_LIBRARY}}" -p:CliDirectory="{{.MANAGED}}/bin/Isoplane.Cli.Tests/release" -p:Platform={{.PLATFORM}}'

  debugger:environment:
    vars:
      DIRECTORY: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/dap-python'
      EXECUTABLE: '{{.DIRECTORY}}/{{if eq OS "windows"}}Scripts/python.exe{{else}}bin/python{{end}}'
    status:
      - |
        "{{.EXECUTABLE}}" -c "import debugpy; assert debugpy.__version__ == '1.8.20'"
    cmds:
      - '"{{.PYTHON}}" -m venv "{{.DIRECTORY}}"'
      - '"{{.EXECUTABLE}}" -m pip install --disable-pip-version-check debugpy==1.8.20'

  editor:
    desc: Exercise launch and value editing inside VS Code using ISOPLANE_TEST_CLI
    deps: [':fixtures:editor', ':cli', editor:environment]
    env:
      ISOPLANE_TEST_PROJECT: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/editor-fixture/app'
    cmds:
      - '{{if eq OS "linux"}}xvfb-run -a {{end}}npm --prefix tools/vscode-isoplane run test:launch'

  editor:environment:
    sources:
      - tools/vscode-isoplane/package.json
      - tools/vscode-isoplane/package-lock.json
    generates:
      - tools/vscode-isoplane/node_modules/.package-lock.json
    cmds:
      - npm --prefix tools/vscode-isoplane ci
