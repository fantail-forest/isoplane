version: '3'

tasks:
  default:
    desc: Prepare fixtures, then run the Rust test suite
    deps: [':initialize', ':fixtures']
    env: &test_env
      ISOPLANE_TEST_SKIP_PUBLICATION_FLUSH: '1'
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo test --workspace {{.CLI_ARGS}}'

  unit:
    desc: Run Rust library tests without preparing integration fixtures
    deps: [':initialize']
    env: *test_env
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo test --lib {{.CLI_ARGS}}'

  rust:
    desc: Prepare the guest fixtures Rust tests load and run selected Rust tests
    deps: [':initialize', ':fixtures:rust', ':fixtures:dotnet', ':fixtures:acceptance', ':fixtures:package', ':fixtures:compiled-runtime', ':node:runtimes']
    env: *test_env
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo test {{.CLI_ARGS}}'

  runtime:
    desc: Run shared runtime acceptance tests
    deps: [':initialize', ':fixtures:acceptance', ':fixtures:feed', ':fixtures:package', ':fixtures:compiled-runtime']
    env: *test_env
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo test -p isoplane-runtime-acceptance {{.CLI_ARGS}}'

  native:
    desc: Run SDK and CLI integration tests using prepared packages
    deps: [':initialize', ':cli', ':fixtures:feed', ':fixtures:runtime', ':fixtures:projects', ':fixtures:package', ':managed:tests', ':test:debugger:environment', ':test:managed:host']
    env: *test_env
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo test -p isoplane-native {{.CLI_ARGS}}'

  debugger:
    desc: Run selected native debugger integration tests
    deps: [':initialize', ':cli', ':managed:tests', ':test:debugger:environment', ':fixtures:feed', ':fixtures:runtime', ':fixtures:projects', ':fixtures:package:debugger', ':fixtures:package:debugger-optimized', ':fixtures:debugger:hotreload:package', ':test:managed:host']
    env: *test_env
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo test -p isoplane-native --test installed_dev {{.CLI_ARGS}}'

  managed:
    desc: Run all managed tests using prepared assemblies
    deps: [managed:standard]

  managed:prepare:
    internal: true
    run: once
    deps: [managed:host, ':managed:template-package', ':runtime:toolchain', process-fixture, managed-bundle-fixture, source-changes-fixture]

  managed:standard:
    desc: Run managed tests; pass -- --filter <expression> to select tests
    deps: [managed:prepare]
    env:
      ISOPLANE_TEST_SKIP_PUBLICATION_FLUSH: '1'
      # Packages the tests restore stay in this worktree, not the user's NuGet cache.
      NUGET_PACKAGES: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/test-nuget-packages'
    cmds:
      - |
        "{{.DOTNET}}" test "{{.MANAGED}}"/bin/*/release/*.Tests.dll --parallel {{.CLI_ARGS}}

  managed-bundle-fixture:
    label: 'managed-bundle-fixture:{{.PLATFORM}}'
    desc: Prepare reusable assembly, symbol and SDK metadata inputs for bundle tests
    deps: [':initialize']
    vars:
      DIRECTORY: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/managed-bundle-fixture'
    sources:
      - tools/Isoplane.Cli.Tests/fixtures/ManagedBundle/**/*
      - guest-sdks/dotnet/Build/Isoplane.ManagedBundle.targets
      - Directory.Build.props
      - global.json
      - taskfiles/test.yml
    generates:
      - '{{.DIRECTORY}}/result.json'
      - '{{.DIRECTORY}}/bin/Application/debug/Application.dll'
      - '{{.DIRECTORY}}/bin/Application/debug/Application.pdb'
      - '{{.DIRECTORY}}/bin/Application/debug/fr/Application.resources.dll'
      - '{{.DIRECTORY}}/bin/Application/debug/fr-CA/Application.resources.dll'
      - '{{.DIRECTORY}}/bin/Dependency/debug/Dependency.dll'
      - '{{.DIRECTORY}}/bin/Dependency/debug/Dependency.pdb'
    cmds:
      - 'mkdir -p "{{.DIRECTORY}}"'
      - '"{{.DOTNET}}" msbuild tools/Isoplane.Cli.Tests/fixtures/ManagedBundle/Application/Application.csproj -restore -t:IsoplaneManagedBundle -p:UseArtifactsOutput=true -p:ArtifactsPath="{{.DIRECTORY}}" -getProperty:AssemblyName,IsoplaneRuntimeDirectory -getItem:ReferencePath,IsoplaneBundleAssembly,IsoplaneBundleSymbol,IsoplaneBundleAsset,IsoplaneBundlePlatformReference -getResultOutputFile:"{{.DIRECTORY}}/result.json" -nodeReuse:false'

  source-changes-fixture:
    desc: Prepare the project graph used by source-watching tests
    deps: [':initialize']
    vars:
      DIRECTORY: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/source-changes-fixture'
    sources:
      - tools/Isoplane.Cli.Tests/fixtures/SourceChanges/**/*
      - global.json
      - taskfiles/test.yml
    generates:
      - '{{.DIRECTORY}}/artifacts/bin/Application/release/Application.dll'
      - '{{.DIRECTORY}}/artifacts/bin/Dependency/release/Dependency.dll'
    cmds:
      - '"{{.PYTHON}}" -c "import shutil; shutil.copytree(''tools/Isoplane.Cli.Tests/fixtures/SourceChanges'', ''{{.DIRECTORY}}'', dirs_exist_ok=True); shutil.copyfile(''global.json'', ''{{.DIRECTORY}}/global.json'')"'
      - '"{{.DOTNET}}" build "{{.DIRECTORY}}/Application/Application.csproj" -c Release'

  process-fixture:
    internal: true
    label: 'process-fixture:{{.PLATFORM}}'
    deps: [':initialize']
    sources:
      - tools/Isoplane.Testing.Tests/fixtures/ProcessFixture/*
      - Directory.Build.props
      - global.json
      - nuget.config
      - taskfiles/test.yml
    generates:
      - '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/managed-fixtures/bin/ProcessFixture/release/ProcessFixture{{if eq OS "windows"}}.exe{{end}}'
      - '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/managed-fixtures/bin/ProcessFixture/release/ProcessFixture.dll'
    cmds:
      - '"{{.DOTNET}}" build tools/Isoplane.Testing.Tests/fixtures/ProcessFixture -c Release --artifacts-path "{{.ROOT_DIR}}/.build/{{.PLATFORM}}/managed-fixtures"'

  managed:host:
    internal: true
    run: once
    deps: [':managed:tests', ':native:release']
    cmds:
      - for: [Isoplane.Cli.Tests, Isoplane.Testing.Tests]
        cmd: '"{{.DOTNET}}" msbuild taskfiles/StageCli.proj -nologo -p:NativeLibrary="{{.NATIVE_TARGET}}/release/{{.NATIVE_LIBRARY}}" -p:CliDirectory="{{.MANAGED}}/bin/{{.ITEM}}/release" -p:Platform={{.PLATFORM}}'

  debugger:environment:
    vars:
      DIRECTORY: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/dap-python'
      EXECUTABLE: '{{.DIRECTORY}}/{{if eq OS "windows"}}Scripts/python.exe{{else}}bin/python{{end}}'
    status:
      # Reject invalid executables instead of allowing the shell's script fallback.
      - |
        "{{.PYTHON}}" -c "import subprocess, sys; subprocess.run([sys.argv[1], '-c', sys.argv[2]], check=True, timeout=30)" "{{.EXECUTABLE}}" "import debugpy; assert debugpy.__version__ == '1.8.20'"
    cmds:
      - '"{{.PYTHON}}" -m venv --clear "{{.DIRECTORY}}"'
      - '"{{.EXECUTABLE}}" -m pip install --disable-pip-version-check debugpy==1.8.20'

  editor:
    desc: Exercise launch and value editing inside VS Code
    deps: [':fixtures:editor', ':cli', editor:environment, editor:unit]
    env:
      ISOPLANE_TEST_PROJECT: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/editor-fixture/app'
      ISOPLANE_TEST_CLI: '{{env "ISOPLANE_TEST_CLI" | default .CLI}}'
      ISOPLANE_TEST_SKIP_PUBLICATION_FLUSH: '1'
    cmds:
      - '{{if eq OS "linux"}}xvfb-run -a {{end}}npm --prefix tools/vscode-isoplane test -- {{.CLI_ARGS | default "launch"}}'

  editor:unit:
    desc: Check editor Hot Reload scheduling without launching VS Code
    cmds:
      - node --test tools/vscode-isoplane/test/*.test.js

  editor:environment:
    sources:
      - tools/vscode-isoplane/package.json
      - tools/vscode-isoplane/package-lock.json
    generates:
      - tools/vscode-isoplane/node_modules/.package-lock.json
    cmds:
      - npm --prefix tools/vscode-isoplane ci
