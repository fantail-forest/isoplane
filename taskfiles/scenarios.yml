version: '3'

vars:
  SCENARIOS: '{{.ROOT_DIR}}/.build/clr-anycpu/scenarios'

env:
  ISOPLANE_RUNTIME_DIRECTORY: '{{.MODULES}}'
  ISOPLANE_MANAGED_ARTIFACTS: '{{.MANAGED}}'

tasks:
  postgres:
    desc: Run PostgreSQL behavior against the prepared fixture application
    deps: [postgres:build]
    env:
      ISOPLANE_TEST_CLI_ASSEMBLY: '{{.CLI}}'
      ISOPLANE_TEST_DOTNET: '{{.DOTNET}}'
      ISOPLANE_TEST_POSTGRES_APPLICATION: '{{.SCENARIOS}}/Release/postgres'
      ISOPLANE_CLI_ASSEMBLY: '{{.CLI}}'
    cmds:
      - '"{{.PYTHON}}" -m unittest discover -s scenario-tests/developer-experience -p test_postgres.py -v'

  postgres:build:
    internal: true
    deps: [':cli', ':runtime']
    vars:
      DIRECTORY: '{{.SCENARIOS}}/Release/postgres'
    sources:
      - '{{.ROOT_DIR}}/scenario-tests/developer-experience/fixtures/postgres/**/*'
      - '{{.MANAGED}}/bin/Isoplane.Sdk/release/*.dll'
      - '{{.ROOT_DIR}}/guest-sdks/dotnet/Build/*'
      - '{{.CLI}}'
      - '{{.ROOT_DIR}}/Directory.Build.props'
      - '{{.ROOT_DIR}}/taskfiles/scenarios.yml'
    generates:
      - '{{.DIRECTORY}}/bin/Release/**/PostgresFixture.dll'
      - '{{.DIRECTORY}}/obj/project.assets.json'
    cmds:
      - 'test "{{OS}}" = linux || { echo "Prepare scenario applications on Linux first." >&2; exit 1; }'
      - 'mkdir -p "{{.DIRECTORY}}"'
      - 'rsync -a --delete --exclude bin --exclude obj --exclude .isoplane scenario-tests/developer-experience/fixtures/postgres/ "{{.DIRECTORY}}/"'
      - '"{{.DOTNET}}" build "{{.DIRECTORY}}" --configuration Release'
