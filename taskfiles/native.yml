version: '3'

tasks:
  default:
    desc: Build native CLI support for this platform
    run: once
    deps: [':initialize']
    env:
      CARGO_TARGET_DIR: '{{.NATIVE_TARGET}}'
      CARGO_BUILD_BUILD_DIR: '{{.NATIVE_TARGET}}'
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo build --locked -p isoplane-native'

  release:
    desc: Build optimized native CLI support for this platform
    run: once
    deps: [':initialize']
    env:
      CARGO_TARGET_DIR: '{{.NATIVE_TARGET}}'
      CARGO_BUILD_BUILD_DIR: '{{.NATIVE_TARGET}}'
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo build --locked --release -p isoplane-native'
