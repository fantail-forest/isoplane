version: '3'

tasks:
  default:
    desc: Initialize source dependencies and install development tools
    deps: [dotnet, rust, wasm-tools]
    cmds:
      - git submodule update --init

  dotnet:
    deps: [':initialize']
    status:
      - dotnet --version
    cmds:
      - cmd: 'curl --fail --location --output "{{.SCRATCH}}/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh'
        platforms: [linux, darwin]
      - cmd: 'bash "{{.SCRATCH}}/dotnet-install.sh" --jsonfile global.json --install-dir "{{.USER_HOME}}/.dotnet" --no-path'
        platforms: [linux, darwin]
      - cmd: 'curl.exe --fail --location --output "{{.SCRATCH}}/dotnet-install.ps1" https://dot.net/v1/dotnet-install.ps1'
        platforms: [windows]
      - cmd: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{{.SCRATCH}}/dotnet-install.ps1" -JSonFile global.json -InstallDir "{{.USER_HOME}}/.dotnet" -NoPath'
        platforms: [windows]

  release-python:
    desc: Prepare the Python environment for release versioning
    deps: [':initialize']
    sources:
      - '{{.ROOT_DIR}}/scripts/requirements.txt'
      - '{{.ROOT_DIR}}/taskfiles/setup.yml'
    generates:
      - '{{.RELEASE_PYTHON_DIRECTORY}}/pyvenv.cfg'
    cmds:
      - '"{{.PYTHON}}" -m venv --clear "{{.RELEASE_PYTHON_DIRECTORY}}"'
      - '"{{.RELEASE_PYTHON}}" -m pip install --disable-pip-version-check -r scripts/requirements.txt'

  rust:
    cmds:
      - rustup toolchain install

  wasm-tools:
    deps: [':initialize']
    status:
      - 'test "$(wasm-tools --version)" = "wasm-tools {{.WASM_TOOLS_VERSION}}"'
    cmds:
      - cargo install --locked wasm-tools@{{.WASM_TOOLS_VERSION}}

  workload:
    deps: [dotnet]
    platforms: [linux]
    status:
      - dotnet workload list | grep -q '^wasi-experimental '
      - dotnet msbuild taskfiles/WasiWorkload/WasiWorkload.csproj -t:RequireWorkloadPacks -nologo -v:q
    cmds:
      - dotnet workload install wasi-experimental --skip-manifest-update

  licenses:
    deps: [license-rust, license-managed]

  license-rust:
    deps: [':initialize']
    status: ['cargo about --version | grep -q "0.9.2"']
    cmds: ['cargo install --locked --features cli cargo-about --version 0.9.2']

  license-managed:
    deps: [dotnet]
    status: ['"{{.USER_HOME}}/.dotnet/tools/nuget-license" --version | grep -q "4.0.18"']
    cmds: ['"{{.DOTNET}}" tool install --global nuget-license --version 4.0.18']
