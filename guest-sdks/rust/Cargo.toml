[package]
name = "isoplane-guest"
# Cargo finds a workspace root by walking up, which from here reaches the repo
# root, whose `members` list does not include this crate. Naming `guests` gives
# this crate the size-tuned release profile and the `isoplane-abi` features
# (`default-features = false`, `rust-guests`) of the guests that link it.
workspace = "../../guests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Isoplane Rust guest SDK: the isoplane scheduler (a single-threaded, never-blocking executor), typed capability bindings, the snapshot-friendly arena allocator, and template initialization."

[lib]
# rlib only: the `#[no_mangle]` exports are emitted into the *guest* crate by
# `isoplane_guest::export_handler!`, so the linker cannot GC
# them and every guest gets exactly one copy.
crate-type = ["rlib"]

[dependencies]
isoplane-abi = { workspace = true }
serde    = { workspace = true }
postcard = { workspace = true }
serde_json = { workspace = true, optional = true }

[build-dependencies]
isoplane-abi = { workspace = true }

[features]
default = []
json = ["dep:serde_json"]

[dev-dependencies]
# Deployment settings are JSON on the wire, so the SDK's own tests need it.
serde_json = { workspace = true }
