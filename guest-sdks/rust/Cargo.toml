[package]
name = "wisp-guest"
# This crate lives beside the C# SDK in `guest-sdks/`, and belongs to the
# `guests/` Cargo workspace. Those are separate things: the directory is where
# the source is, the workspace is where its build settings come from.
#
# It wants the guest workspace's, not the root one's:
#   * `[profile.release]` there is the size-tuned one (`opt-level = "z"`, LTO,
#     `panic = "abort"`, strip) that the guests linking this crate are built
#     with.
#   * `[workspace.dependencies]` there pins `wisp-abi` with
#     `default-features = false`. Inert today (`default = []`), and a guard
#     worth keeping: a guest must not pick up a host-shaped feature by default.
#
# Naming the root is required because Cargo finds one by walking UP, which from
# here reaches the repo root — whose explicit `members` list does not include
# this crate, so the inherited fields below would have nothing to resolve
# against.
workspace = "../../guests"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "The WISP Rust guest SDK: the wisp scheduler (a single-threaded, never-blocking executor), typed capability bindings, the snapshot-friendly arena allocator, and the pre-init unit registry."

[lib]
# rlib only: the `#[no_mangle]` exports are emitted into the *guest* crate by
# `wisp_guest::export_handler!` / `export_durable!`, so the linker cannot GC
# them and every guest gets exactly one copy.
crate-type = ["rlib"]

[dependencies]
wisp-abi = { workspace = true }
serde    = { workspace = true }
postcard = { workspace = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
json = ["dep:serde_json"]

[dev-dependencies]
# The init-config blob is JSON on the wire, so the SDK's own tests need it.
serde_json = { workspace = true }
