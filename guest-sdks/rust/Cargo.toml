[package]
name = "wisp-guest"
# The guest workspace, named explicitly. Cargo finds a workspace root by walking
# UP from the crate, which from here reaches the repo root — and that one
# excludes `guest-sdks`, so the inherited fields below would fail to resolve
# against it. Naming the root is what lets this crate sit beside the C# SDK in
# `guest-sdks/` while still building under the guest workspace's wasm32 profile.
workspace = "../../guests"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "The WISP Rust guest SDK: the wisp scheduler (a single-threaded, never-blocking executor), typed capability bindings, the snapshot-friendly arena allocator, and the pre-init unit registry."

[lib]
# rlib only: the `#[no_mangle]` exports are emitted into the *guest* crate by
# `wisp_guest::export_handler!` / `export_durable!`, so the linker cannot GC
# them and every guest gets exactly one copy.
crate-type = ["rlib"]

[dependencies]
wisp-abi = { workspace = true }
serde    = { workspace = true }
postcard = { workspace = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
json = ["dep:serde_json"]

[dev-dependencies]
# The init-config blob is JSON on the wire, so the SDK's own tests need it.
serde_json = { workspace = true }
