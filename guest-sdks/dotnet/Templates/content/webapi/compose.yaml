# The PostgreSQL database appsettings.Development.json connects to.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sampleapi
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sampleapi"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  database:
