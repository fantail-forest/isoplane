[package]
name = "wisp-rtlib"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "The body of the shared runtime layer, as a Rust stand-in for `wisp:dotnet-runtime@x.y`: allocator, wisp ABI codec, and a library surface (JSON, regex, hashing, codecs, compression, text, formatting, collections) big enough for the trimming trade-off to be measurable."

[lib]
crate-type = ["rlib"]

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
postcard   = { workspace = true }
wisp-abi   = { workspace = true }
regex       = { version = "1.7", default-features = false, features = ["std", "unicode"] }
base64      = "0.22"
sha2        = { version = "0.10", default-features = false }
miniz_oxide = "0.6"

[features]
default = []
# Emit the `#[no_mangle] extern "C"` symbols. ON for the base layer (which is
# therefore un-trimmable: every entry point is a root), OFF for a
# self-contained app, where the same code is an ordinary rlib and LTO trims it
# to the reachable subset. That difference IS the layering trade-off.
export-abi = []
