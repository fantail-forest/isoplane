[package]
name = "layered-hello"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Tenant 4: hello world. Reaches nothing but the dispatch codec — the floor case, and the one §4.6 cites as the precondition for §12.5's millisecond-scale dynamic admission."

[lib]
crate-type = ["cdylib"]

[dependencies]
wisp-rtabi = { path = "../../rtabi", default-features = false }

[features]
default = []
layered = ["wisp-rtabi/layered"]
selfcontained = ["wisp-rtabi/selfcontained"]
