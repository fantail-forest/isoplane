[package]
name = "wisp-rtabi"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "The tenant-facing view of the shared runtime layer. One source, two link strategies: `layered` turns every runtime entry point into a wasm import satisfied at instantiation by the shared base; `selfcontained` links the identical code in and lets LTO trim it."

[lib]
crate-type = ["rlib"]

[dependencies]
wisp-rtlib = { path = "../rtlib", optional = true }

[features]
default = []
# Tenant modules compile against the runtime component's exported ABI and link
# against it at instantiation.
layered = []
# Whole-program compilation with whole-program trimming — the status quo this is
# being compared against.
selfcontained = ["dep:wisp-rtlib"]
