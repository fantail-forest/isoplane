[package]
name = "wisp-layer-base"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "The §4.6 base layer: the shared runtime component, AOT-compiled once per engine version and pre-initialized once per machine into a base template that every tenant's app layer links against at instantiation."

[lib]
crate-type = ["cdylib"]

[dependencies]
wisp-rtlib = { path = "../rtlib" }
wisp-rtabi = { path = "../rtabi", features = ["selfcontained"] }
