# Declare the instance memory ceiling in the module itself.
#
# Rust's wasm linker emits no memory maximum by default. These fixtures declare
# 128 MiB so the validator can compare that bound with its configured ceiling.
#
# The host captures a guest's globals only through their exports, and V1
# rejects a mutable global the module does not export. `__stack_pointer` is the
# only mutable global the Rust toolchain emits.
[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "link-arg=--max-memory=134217728",
  "-C", "link-arg=--export=__stack_pointer",
]
