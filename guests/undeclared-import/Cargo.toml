[package]
name = "undeclared-import"
description = "Fixture guest that is well-formed except for one undeclared import, for the validator's V1 corpus"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Build variant: the undeclared capability comes from a whole foreign MODULE
# rather than an unknown field of `isoplane`. Both must be rejected by V1.
foreign-module = []

[dependencies]
isoplane-guest = { workspace = true }
isoplane-abi   = { workspace = true }
serde      = { workspace = true }
postcard   = { workspace = true }
