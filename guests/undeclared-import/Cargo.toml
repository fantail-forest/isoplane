[package]
name = "undeclared-import"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Build variant: the undeclared capability comes from a whole foreign MODULE
# rather than an unknown field of `wisp`. Both must be rejected by V1.
foreign-module = []

[dependencies]
wisp-guest = { workspace = true }
wisp-abi   = { workspace = true }
serde      = { workspace = true }
postcard   = { workspace = true }
