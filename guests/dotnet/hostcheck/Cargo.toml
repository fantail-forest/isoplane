# Standalone host ABI checks for the managed HTTP fixture.
[workspace]

[package]
name = "wisp-dotnet-hostcheck"
version = "0.1.0"
edition = "2021"
license-file = "../../../LICENSE.txt"
description = "Checks the managed HTTP fixture response ABI and sample memory round trip"

[[bin]]
name = "wisp-dotnet-hostcheck"
path = "src/main.rs"

# Runs the module through the platform's real validator. Feature-gated because
# `wisp-control` pulls in wizer, which pins a second wasmtime major.
[[bin]]
name = "wisp-validate"
path = "src/bin/wisp-validate.rs"
required-features = ["validator"]

[features]
validator = ["dep:wisp-control"]

[dependencies]
wisp-abi = { path = "../../../crates/wisp-abi" }
wisp-control = { path = "../../../crates/wisp-control", optional = true }
anyhow = "1"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
# Same feature set as wisp-engine: `async` (fibers) stays OFF, because a fiber
# is a hidden native stack and invariant 3 forbids those.
wasmtime = { version = "48", default-features = false, features = [
    "runtime", "std", "anyhow", "cranelift", "pooling-allocator", "backtrace", "demangle",
    "parallel-compilation", "gc", "gc-null",
] }
