# The guest workspace is deliberately SEPARATE from the root one: guests target
# wasm32-unknown-unknown with a size-tuned release profile, while the host
# crates build for the native target. The root Cargo.toml excludes `guests` for
# exactly this reason.
[workspace]
resolver = "2"
members = [
    # The Rust guest SDK. Its source lives beside the C# SDK in `guest-sdks/`;
    # its build settings come from here, because it is compiled for wasm32
    # under the size-tuned release profile below and against the same
    # `wisp-abi` features as the guests that link it. Its own manifest names
    # this workspace, since Cargo would otherwise walk up to the repo root.
    "../guest-sdks/rust",
    "hello",
    "quotes-api",
    "misbehaver",
    "undeclared-import",
    "impure-cctor",
    "bigheap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE.txt"

[workspace.dependencies]
wisp-guest = { path = "../guest-sdks/rust" }
# The contract. Built from the same source as the host side, so the encoding
# on both sides of the sandbox boundary is one implementation, not two.
wisp-abi   = { path = "../crates/wisp-abi", default-features = false }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
postcard   = { version = "1", features = ["alloc"] }

# Tuned for size: a guest module is carried per version and instantiated per
# instance. panic=abort is not just a size knob -- kills are abrupt and are
# never unwound, so a guest that could unwind would be modelling something the
# platform does not offer.
[profile.release]
opt-level        = "z"
lto              = true
codegen-units    = 1
panic            = "abort"
strip            = true
overflow-checks  = false
debug            = false
