[workspace]
resolver = "2"
members = [
    "../guest-sdks/rust",
    "hello",
    "quotes-api",
    "misbehaver",
    "undeclared-import",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
isoplane-guest = { path = "../guest-sdks/rust" }
# The contract. Built from the same source as the host side, so the encoding
# on both sides of the sandbox boundary is one implementation, not two.
# `rust-guests` adds the imports and records only a Rust guest uses.
isoplane-abi   = { path = "../crates/isoplane-abi", default-features = false, features = ["rust-guests"] }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
postcard   = { version = "1", features = ["alloc"] }

# Tuned for size: a guest module is carried per version and instantiated per
# instance. panic=abort is not just a size knob -- kills are abrupt and are
# never unwound, so a guest that could unwind would be modelling something the
# platform does not offer.
[profile.release]
opt-level        = "z"
lto              = true
codegen-units    = 1
panic            = "abort"
strip            = true
overflow-checks  = false
debug            = false
