[build]
# Hosts share this worktree, so each needs its own target directory, which
# scripts/dev and Task set through CARGO_TARGET_DIR. This path is a file, so
# Cargo run without them fails instead of sharing one directory across hosts.
target-dir = ".run-cargo-through-scripts-dev"

[net]
# Use the developer's Git/SSH authentication for private source dependencies.
git-fetch-with-cli = true

[env]
# Managed guests have substantial private memories. Bound libtest concurrency
# even on hosts reporting hundreds of CPUs; an explicit environment overrides it.
RUST_TEST_THREADS = "4"

# The CLI must load its native support before setup can install tool prerequisites.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
