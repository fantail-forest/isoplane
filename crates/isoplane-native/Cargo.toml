[package]
name = "isoplane-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Native platform support for managed Isoplane development tools"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
isoplane-runtime = { workspace = true, features = ["local"] }
isoplane-abi = { workspace = true, features = ["host"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasmparser.workspace = true

anyhow.workspace = true
isoplane-engine.workspace = true
isoplane-host.workspace = true
isoplane-prepare.workspace = true
isoplane-proxy.workspace = true
isoplane-hibernate.workspace = true
isoplane-trust.workspace = true
parking_lot.workspace = true
blake3.workspace = true
rand.workspace = true
zstd.workspace = true
tempfile.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fd-lock.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
procfs.workspace = true
rustix.workspace = true

[build-dependencies]
csbindgen.workspace = true

[dev-dependencies]
http-body-util.workspace = true
wat.workspace = true
isoplane-fixtures.workspace = true
reqwest.workspace = true
portable-pty.workspace = true
toml.workspace = true
