[package]
publish = false
name = "isoplane-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native platform support for managed Isoplane development tools"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
isoplane-cache.workspace = true
isoplane-runtime = { workspace = true, features = ["local"] }
isoplane-abi = { workspace = true, features = ["host"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

anyhow.workspace = true
isoplane-engine.workspace = true
isoplane-host.workspace = true
isoplane-prepare.workspace = true
isoplane-proxy.workspace = true
isoplane-hibernate.workspace = true
isoplane-trust.workspace = true
parking_lot.workspace = true
blake3.workspace = true
sha2.workspace = true
rand.workspace = true
zstd.workspace = true
tempfile.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fd-lock.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
procfs.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
win32job.workspace = true

[build-dependencies]
csbindgen.workspace = true

[dev-dependencies]
http-body-util.workspace = true
wat.workspace = true
isoplane-fixtures.workspace = true
isoplane-test-support.workspace = true
reqwest.workspace = true
portable-pty.workspace = true
strip-ansi-escapes.workspace = true
toml.workspace = true
