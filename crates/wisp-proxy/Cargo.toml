[package]
name = "wisp-proxy"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "HTTP proxy with route resolution, admission control and request dispatch"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
wisp-abi = { workspace = true, features = ["host"] }
# NOTE: no `wisp-control` dependency. The proxy consumes a *resolved* route
# through the `routes::RouteResolver` trait so that it compiles and is testable
# without the control plane; `wispd` supplies the control-plane-backed impl.
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
