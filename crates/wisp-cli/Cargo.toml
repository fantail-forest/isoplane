[package]
name = "wisp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Local project development and WebAssembly validation"

[lib]
name = "wisp_cli"
path = "src/lib.rs"

[[bin]]
name = "wisp"
path = "src/main.rs"

[[bin]]
name = "wisp-process"
path = "src/process/main.rs"

[dependencies]
wisp-trust = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
wisp-abi = { workspace = true, features = ["host"] }

toml = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
wasmparser = { workspace = true }
reqwest = { workspace = true }

wisp-runtime = { workspace = true, features = ["local"] }
wisp-prepare.workspace = true
wisp-host = { workspace = true }
wisp-engine = { workspace = true }
wisp-hibernate = { workspace = true }
wisp-proxy = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
fd-lock = { workspace = true }
zstd = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }

[features]
# Include the full validator in local module checks by default.
default = ["control"]
control = []

[dev-dependencies]
portable-pty = { workspace = true }
tokio = { workspace = true }
wat = { workspace = true }
wisp-fixtures = { workspace = true }
