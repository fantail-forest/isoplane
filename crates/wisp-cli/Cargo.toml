[package]
name = "wisp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "WebAssembly validation"

[lib]
name = "wisp_cli"
path = "src/lib.rs"

[[bin]]
name = "wisp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
wisp-abi = { workspace = true, features = ["host"] }

toml = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
wasmparser = { workspace = true }
reqwest = { workspace = true }

# `doctor` only validates, so `default-features = false` drops `preinit` and
# the second wasmtime wizer embeds. A path dependency because cargo ignores a
# member's `default-features = false` on a `workspace = true` entry.
wisp-control = { path = "../wisp-control", optional = true, default-features = false }

[features]
# Include the full validator in local module checks by default.
default = ["control"]
control = ["dep:wisp-control"]

[dev-dependencies]
tokio = { workspace = true }
wat = { workspace = true }
tempfile = { workspace = true }

