[package]
name = "wisp-docs"
version.workspace = true
edition.workspace = true
license-file.workspace = true
# Opted into explicitly: without it clippy assumes the current toolchain and
# suggests `is_multiple_of`, which landed in 1.87.
rust-version.workspace = true
description = "Generates the reference pages of docs/userdocs from the definitions they document, and fails a test when the checked-in pages have drifted."

[lib]
name = "wisp_docs"
path = "src/lib.rs"

[[bin]]
name = "wisp-docs"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
# rustdoc JSON, read field-by-field rather than through a schema-pinned crate.
serde_json = { workspace = true }
# The C# compiler's XML doc output. A read-only DOM is the right shape for
# mixed content (`<summary>` holds text interleaved with `<c>` and `<see/>`).
roxmltree = "0.21"
# The default column of every config table is produced by deserializing an
# empty document through the real serde defaults, rather than being typed out.
toml = { workspace = true }

# The definitions the reference pages describe. Each of these is a *source of
# truth* for a page, and the dependency is the point: a number that moves in
# one of these crates cannot stay still in the docs.
wisp-abi = { workspace = true }
# `default-features = false` drops wizer, which embeds a second wasmtime. The
# docs need the rule codes and the V4 ceilings, not a pre-initializer.
wisp-control = { path = "../wisp-control", default-features = false }
wisp-proxy = { workspace = true }
# The `/metrics` table is rendered by asking the real exporter to render, then
# reading its own `# HELP`/`# TYPE` lines back. `--no-default-features` keeps
# wasmtime out of the docs build: `wispd::metrics` and `wispd::config` are not
# behind the `real-backends` feature.
# A path dependency rather than `workspace = true`: `default-features = false` is
# only honoured on a workspace dependency that declares it too, and the docs
# build has no business pulling wasmtime.
wispd = { path = "../wispd", default-features = false }
wisp-cli = { workspace = true }
# The three command lines, as types. `wisp-docs` walks the same `clap::Command`
# the binaries parse with, so a flag cannot exist without appearing on its page.
clap = { workspace = true }
# The V2 table is `everything wasmparser knows` minus the engine profile, so
# the docs need the same flag set the validator is configured with.
wasmparser = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
