[package]
publish = false
name = "isoplane-runtime-acceptance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Acceptance tests for the source-built guest runtime: its scheduling, socket, name-resolution, cryptography and HTTP integrations, and application packages on the shared interpreter runtime, driven through the real host reactor"

[dev-dependencies]
brotli = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
fs4 = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
h2 = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
socket2 = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
isoplane-abi = { workspace = true, features = ["host"] }
isoplane-engine = { workspace = true }
isoplane-fixtures = { workspace = true }
isoplane-harness = { workspace = true }
isoplane-prepare = { workspace = true }
blake3 = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }
isoplane-host = { workspace = true }
isoplane-proxy = { workspace = true }
