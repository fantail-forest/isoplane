[package]
name = "wisp-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "WebAssembly module validation, pre-initialization and native compilation"

[dependencies]
rand = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
wisp-abi = { workspace = true, features = ["host"] }
wisp-engine = { workspace = true }
async-trait = { workspace = true }
wasmparser = { workspace = true }
# Wizer's engine produces WebAssembly bytes for the separate execution engine.
wizer = { workspace = true, optional = true }
wasmtime = { workspace = true, features = ["default", "winch"] }
blake3 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
zstd = { workspace = true }
parking_lot = { workspace = true }
libc = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
wat = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
wisp-fixtures = { workspace = true }

[features]
# Consumers that only validate modules can disable initialization support.
default = ["preinit"]
preinit = ["dep:wizer", "dep:rayon", "dep:libc"]
