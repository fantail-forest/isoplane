[package]
publish = false
name = "isoplane-abi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "The isoplane:platform@1 contract: dispatch/result records, poll status, the canonical import table, and application resource limits."

[dependencies]
serde = { workspace = true }
serde_bytes = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }

# Off by default so a guest SDK can depend on this crate from wasm32.
async-trait = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[features]
default = []
host = ["dep:async-trait", "dep:anyhow"]

[dev-dependencies]
serde_json.workspace = true
isoplane-test-support.workspace = true

[build-dependencies]
roxmltree.workspace = true
