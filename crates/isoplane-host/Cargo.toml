[package]
publish = false
name = "isoplane-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The cell: reactor threads, execution pool, future table, wake router, import vtable, meters, lifecycle tiers"

[dependencies]
prometheus = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
isoplane-abi = { workspace = true, features = ["host"] }
isoplane-engine = { workspace = true }
isoplane-hibernate = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
postcard = { workspace = true }
futures = { workspace = true }
socket2 = { workspace = true }
hickory-resolver = { workspace = true }
libc = { workspace = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
rand = { workspace = true }
rand_chacha.workspace = true
scc = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true, optional = true }

[features]
# Entry points and observations the test suites drive the cell through. No shipped build enables it.
test-util = ["dep:prometheus"]
# Experimental: Rust guests are not a supported guest language yet.
rust-guests = [
    "isoplane-abi/rust-guests",
    "isoplane-engine/rust-guests",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:bytes",
    "dep:url",
]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
isoplane-host = { workspace = true, features = ["test-util", "rust-guests"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
wat = { workspace = true }
isoplane-fixtures = { workspace = true }
isoplane-test-support = { workspace = true }
isoplane-harness = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
