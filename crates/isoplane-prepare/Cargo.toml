[package]
publish = false
name = "isoplane-prepare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local sandbox initialization and prepared application production"

[dependencies]
fs4.workspace = true
anyhow.workspace = true
async-trait.workspace = true
rayon.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
blake3.workspace = true
parking_lot.workspace = true
isoplane-abi = { workspace = true, features = ["host"] }
isoplane-engine.workspace = true
isoplane-host.workspace = true
isoplane-runtime.workspace = true
wasmparser.workspace = true
wasm-encoder.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tar.workspace = true
hex.workspace = true

[features]
# Experimental: Rust guests are not a supported guest language yet.
rust-guests = [
    "isoplane-abi/rust-guests",
    "isoplane-engine/rust-guests",
    "isoplane-host/rust-guests",
    "isoplane-runtime/rust-guests",
]

[dev-dependencies]
isoplane-prepare = { workspace = true, features = ["rust-guests"] }
isoplane-engine = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
isoplane-fixtures.workspace = true
wasmtime.workspace = true
wat.workspace = true
