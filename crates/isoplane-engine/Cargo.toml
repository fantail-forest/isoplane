[package]
name = "isoplane-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "wasmtime embedding: template pre-init, instance slots, CoW activation, epoch budgets, thread-CPU metering"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
tracing = { workspace = true }
isoplane-abi = { workspace = true, features = ["host"] }
wasmtime = { workspace = true }
wasmparser = { workspace = true }
cpu-time = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
postcard = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }

memmap2 = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# Hand-written .wat fixtures, so a guest-SDK bug is never mistaken for an
# engine bug.
wat = { workspace = true }
isoplane-fixtures = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
toml.workspace = true
