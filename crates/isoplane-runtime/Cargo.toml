[package]
publish = false
name = "isoplane-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Shared guest admission and host bindings, without deployment or node administration"

[dependencies]
blake3.workspace = true
hex.workspace = true
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
isoplane-abi = { workspace = true, features = ["host"] }
wasmparser = { workspace = true }
parking_lot = { workspace = true }

async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
isoplane-host = { workspace = true, optional = true }
isoplane-proxy = { workspace = true, optional = true }

[features]
default = []
local = ["dep:tokio", "dep:isoplane-host", "dep:isoplane-proxy"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
wat = { workspace = true }
isoplane-fixtures = { workspace = true }
