[package]
publish = false
name = "isoplaned"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The cell daemon: wires engine + host + control + proxy into a runnable node"

[lib]
name = "isoplaned"
path = "src/lib.rs"

[[bin]]
name = "isoplaned"
path = "src/main.rs"

[dependencies]
prometheus = { workspace = true }
fs4.workspace = true
isoplane-trust = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { workspace = true }
url = { workspace = true }
reqwest-otlp = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
isoplane-abi = { workspace = true, features = ["host"] }
isoplane-proxy = { workspace = true }

isoplane-control   = { workspace = true }
isoplane-host      = { workspace = true }
isoplane-hibernate = { workspace = true }
isoplane-prepare   = { workspace = true }
tempfile       = { workspace = true }
isoplane-engine    = { workspace = true }

isoplane-runtime = { workspace = true, features = ["local"] }

[dev-dependencies]
isoplane-harness = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
wat = { workspace = true }
tempfile = { workspace = true }
isoplane-fixtures = { workspace = true }
isoplane-test-support = { workspace = true }
tar = { workspace = true }

[[example]]
name = "mapped-load"
path = "examples/mapped_load/main.rs"
