[package]
name = "wisp-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "wasmtime embedding: template pre-init, instance slots, CoW activation, epoch budgets, thread-CPU metering"

[features]
# Controlled full-template read experiment; production keeps demand paging.
eager-template-read-experiment = []

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
wisp-abi = { workspace = true, features = ["host"] }
# No `async`: wasmtime's epoch yielding runs on fibers, hidden native stacks
# a parked instance must not hold. With the feature off that code is not
# compiled in.
wasmtime = { workspace = true, features = [
    "anyhow",
    "runtime",
    "std",
    "cranelift",
    "pooling-allocator",
    "call-hook",
    "backtrace",
    "demangle",
    "parallel-compilation",
    "gc", "gc-null",        # funcref/externref plumbing; the wasm-gc proposal is off
] }
wasmparser = { workspace = true }
cpu-time = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
postcard = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }

memmap2 = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# Hand-written .wat fixtures, so a guest-SDK bug is never mistaken for an
# engine bug.
wat = { workspace = true }
wisp-fixtures = { workspace = true }
