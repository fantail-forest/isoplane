[package]
name = "wispd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "The cell daemon: wires engine + host + control + proxy into a runnable node"

[lib]
name = "wispd"
path = "src/lib.rs"

[[bin]]
name = "wispd"
path = "src/main.rs"

[dependencies]
zstd.workspace = true
fs4.workspace = true
wisp-trust = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
wisp-abi = { workspace = true, features = ["host"] }
wisp-proxy = { workspace = true }

# Optional so that a `--no-default-features` build is a fake-cell daemon
# without wasmtime; on by default.
wisp-control   = { workspace = true, optional = true }
wisp-host      = { workspace = true, optional = true }
wisp-hibernate = { workspace = true, optional = true }
wisp-prepare   = { workspace = true, optional = true }
tempfile       = { workspace = true, optional = true }
wisp-engine    = { workspace = true, optional = true }

wisp-runtime = { workspace = true, optional = true, features = ["local"] }

[features]
default = ["real-backends"]
real-backends = [
    "dep:wisp-control",
    "dep:wisp-runtime",
    "dep:wisp-host",
    "dep:wisp-hibernate",
    "dep:wisp-engine",
    "dep:wisp-prepare",
    "dep:tempfile",
]

[dev-dependencies]
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
wat = { workspace = true }
tempfile = { workspace = true }
wisp-fixtures = { workspace = true }

[[example]]
name = "mapped-load"
path = "examples/mapped_load/main.rs"
required-features = ["real-backends"]

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
