[package]
publish = false
name = "isoplane-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local preparation admission and protected files"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
isoplane-abi = { workspace = true, features = ["host"] }
isoplane-runtime = { workspace = true }
rustix.workspace = true
libc.workspace = true
tempfile.workspace = true
zstd = { workspace = true, optional = true }

[features]
# Experimental: Rust guests are not a supported guest language yet.
rust-guests = ["isoplane-abi/rust-guests", "isoplane-runtime/rust-guests", "dep:zstd"]

[dev-dependencies]
isoplane-control = { workspace = true, features = ["rust-guests"] }
isoplane-engine = { workspace = true, features = ["test-util", "rust-guests"] }
blake3.workspace = true
isoplane-prepare = { workspace = true, features = ["rust-guests"] }
tokio-util.workspace = true
wasmparser = { workspace = true }
wat = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
rustls-pki-types = { workspace = true }
sha1 = { workspace = true }
isoplane-fixtures = { workspace = true }
isoplane-test-support = { workspace = true }
isoplane-harness = { workspace = true }
isoplane-host = { workspace = true, features = ["test-util", "rust-guests"] }
