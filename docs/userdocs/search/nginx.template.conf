# The only routes the machine answers. Everything else, including every
# Typesense admin endpoint, is 404 before it reaches Typesense. The nginx image
# fills ${DOCS_SEARCH_KEY} from the environment at start.

# Fly's proxy is the peer; the client is in its header.
limit_req_zone $http_fly_client_ip zone=search_client:10m rate=10r/s;
limit_req_zone $server_name zone=search_all:1m rate=100r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name search;

  location = /health {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8108/health;
  }

  location = /multi_search {
    limit_except POST { deny all; }
    if ($http_x_typesense_api_key != "${DOCS_SEARCH_KEY}") { return 403; }
    limit_req zone=search_client burst=30 nodelay;
    limit_req zone=search_all burst=200 nodelay;
    error_page 429 = @limited;
    client_max_body_size 16k;
    # Typesense takes the last value of a repeated parameter: one query per call.
    proxy_pass http://127.0.0.1:8108/multi_search?$args&limit_multi_searches=1;
  }

  location @limited {
    add_header Retry-After 5 always;
    return 429;
  }

  location / {
    return 404;
  }
}
