version: '3'

dotenv: [tools.env]

vars:
  REVISION:
    sh: git rev-parse HEAD
  SOURCE_REF:
    sh: git rev-parse --path-format=relative --git-path "$(git symbolic-ref -q HEAD || echo HEAD)"
  USER_HOME: '{{env "HOME" | default (env "USERPROFILE")}}'
  DOTNET: '{{env "DOTNET_ROOT" | default (printf "%s/.dotnet" .USER_HOME)}}/dotnet{{if eq OS "windows"}}.exe{{end}}'
  PATH_SEPARATOR: '{{if eq OS "windows"}};{{else}}:{{end}}'
  # Task evaluates this on every run, so running any task registers the Git hooks: installing the
  # root package runs Husky.
  GIT_HOOKS:
    sh: |
      command -v pnpm >/dev/null || { mkdir -p "{{.USER_HOME}}/.local/bin" && corepack enable --install-directory "{{.USER_HOME}}/.local/bin" pnpm; } &&
      pnpm install --frozen-lockfile
  DEFAULT_PYTHON:
    # MSYS2's Python uses a POSIX virtualenv layout; the Windows launcher selects native Python.
    sh: '{{if and (eq OS "windows") (not .ISOPLANE_PYTHON)}}py -3 -c "import pathlib, sys; print(pathlib.Path(sys.executable).as_posix())"{{else}}printf python3{{end}}'
  PYTHON: '{{.ISOPLANE_PYTHON | default .DEFAULT_PYTHON}}'
  PLATFORM: '{{if eq OS "darwin"}}osx{{else if eq OS "windows"}}win{{else}}{{OS}}{{end}}-{{if eq ARCH "amd64"}}x64{{else}}{{ARCH}}{{end}}'
  RELEASE_PYTHON_DIRECTORY: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/release-python'
  RELEASE_PYTHON: '{{.RELEASE_PYTHON_DIRECTORY}}/{{if eq OS "windows"}}Scripts/python.exe{{else}}bin/python{{end}}'

  DEVELOPMENT_COMMAND: '{{if eq OS "windows"}}powershell.exe -NoProfile -ExecutionPolicy Bypass -File taskfiles/windows-developer.ps1 {{end}}'

  NATIVE_LIBRARY: '{{if eq OS "windows"}}isoplane_native.dll{{else if eq OS "darwin"}}libisoplane_native.dylib{{else}}libisoplane_native.so{{end}}'
  MANAGED: '{{.ROOT_DIR}}/.build/clr-anycpu/managed'
  HOT_RELOAD_ARTIFACTS: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/hotreload-fixture'
  PACKAGES: '{{.ROOT_DIR}}/.build/clr-anycpu/packages'
  TEMPLATE_SKILLS: '{{.ROOT_DIR}}/.build/clr-anycpu/template-skills'
  CLI: '{{.MANAGED}}/bin/Isoplane.Cli/release/Isoplane.Cli.dll'
  NATIVE_TARGET: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/native'
  # A workflow passes the Windows checkout path with backslashes, which a source glob reads as escapes.
  RELEASE_NATIVE_ROOT: '{{.ISOPLANE_RELEASE_NATIVE_ROOT | default (printf "%s/.build" .ROOT_DIR) | toSlash}}'
  RELEASE_NATIVE_LIBRARY: '{{.RELEASE_NATIVE_ROOT}}/{{.PLATFORM}}/native/release/{{.NATIVE_LIBRARY}}'
  SCRATCH: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/tmp'
  TEST_RUNTIME_CACHE: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/test-runtimes/cache'
  TEST_FIXTURE_CACHE: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/test-fixture-cache'
  TEST_DOTNET: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/test-dotnet'
  TEST_HOME: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/test-home'
  TEST_COMPILED_RUNTIME: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/test-compiled-runtime'

  # Prefix for a Cargo build run with --message-format=json-render-diagnostics: fails when a package it
  # compiled enables a test-util feature. The pipe to jq is made inside the development command.
  REFUSE_TEST_FEATURES: '{{.DEVELOPMENT_COMMAND}}bash taskfiles/refuse-test-features.sh '

  MODULES: '{{.ISOPLANE_TEST_RUNTIME_MODULES | default (printf "%s/.build/wasm32/runtime-modules" .ROOT_DIR)}}'
  FEED: '{{.ISOPLANE_TEST_RUNTIME_FEED | default (printf "%s/.build/wasm32/runtime/feed" .ROOT_DIR)}}'

env:
  # Task also gives this to the shell that evaluates the variables above, before they have values, so it names none of them.
  PATH: '{{env "HOME" | default (env "USERPROFILE")}}/.dotnet{{if eq OS "windows"}};{{else}}:{{end}}{{env "HOME" | default (env "USERPROFILE")}}/.cargo/bin{{if eq OS "windows"}};{{else}}:{{end}}{{env "HOME" | default (env "USERPROFILE")}}/.local/bin{{if eq OS "windows"}};{{else}}:{{end}}{{if eq OS "windows"}}C:/msys64/mingw64/bin;C:/msys64/usr/bin;{{end}}{{env "PATH"}}'
  DOTNET_ROOT: '{{env "DOTNET_ROOT" | default (printf "%s/.dotnet" .USER_HOME)}}'
  # A Release build of the CLI sends telemetry, and tests run one; every task and development shell opts out.
  ISOPLANE_TELEMETRY_OPTOUT: '1'
  CARGO_TARGET_DIR: '{{env "CARGO_TARGET_DIR" | default .NATIVE_TARGET}}'
  CARGO_BUILD_BUILD_DIR: '{{env "CARGO_BUILD_BUILD_DIR" | default (env "CARGO_TARGET_DIR") | default .NATIVE_TARGET}}'
  ISOPLANE_BUILD_ROOT: '{{.ROOT_DIR}}'
  ISOPLANE_RUNTIME_SOURCE: '{{.ROOT_DIR}}/guest-runtime'
  ISOPLANE_RUNTIME_WORK: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/development/runtime-work'
  WASI_SDK_PATH: '{{env "WASI_SDK_PATH" | default (printf "%s/.build/%s/development/runtime-work/wasi-sdk" .ROOT_DIR .PLATFORM)}}'
  NUGET_SCRATCH: '{{.SCRATCH}}/nuget'
  TMPDIR: '{{.SCRATCH}}'
  TMP: '{{.SCRATCH}}'
  TEMP: '{{.SCRATCH}}'
  ISOPLANE_TEST_CLI_ASSEMBLY: '{{.CLI}}'
  ISOPLANE_TEST_PACKAGE_FEED: '{{.PACKAGES}}'
  ISOPLANE_TEST_RUNTIME_CACHE: '{{.TEST_RUNTIME_CACHE}}'
  ISOPLANE_TEST_FIXTURE_CACHE: '{{.TEST_FIXTURE_CACHE}}'
  ISOPLANE_TEST_DOTNET: '{{.TEST_DOTNET}}'
  ISOPLANE_TEST_HOME: '{{.TEST_HOME}}'
  ISOPLANE_TEST_COMPILED_RUNTIME: '{{.TEST_COMPILED_RUNTIME}}'
  ISOPLANE_TEST_NATIVE_PACKAGE_FEED: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/packages'
  ISOPLANE_TEST_DEBUGGER_PYTHON: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/dap-python/{{if eq OS "windows"}}Scripts/python.exe{{else}}bin/python{{end}}'
  ISOPLANE_TEST_HOT_RELOAD_ARTIFACTS: '{{.HOT_RELOAD_ARTIFACTS}}'
  ISOPLANE_TEST_MANAGED_BUNDLE: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/managed-bundle-fixture'
  ISOPLANE_TEST_SOURCE_CHANGES: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/source-changes-fixture'
  ISOPLANE_TEST_PROCESS_FIXTURE: '{{.ROOT_DIR}}/.build/{{.PLATFORM}}/managed-fixtures/bin/ProcessFixture/release/ProcessFixture{{if eq OS "windows"}}.exe{{end}}'

includes:
  ci: taskfiles/ci.yml
  notices: taskfiles/notices.yml
  node: taskfiles/node.yml
  release: taskfiles/release.yml
  setup: taskfiles/setup.yml
  clean: taskfiles/clean.yml
  managed: taskfiles/managed.yml
  fixtures: taskfiles/fixtures.yml
  generate: taskfiles/generate.yml
  runtime: taskfiles/runtime.yml
  native: taskfiles/native.yml
  test: taskfiles/test.yml
  scenarios: taskfiles/scenarios.yml

tasks:
  docs:limits:
    desc: Generate local execution limits for the customer docs
    deps: [initialize]
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo run --quiet -p isoplane-abi --example local_limits > docs/userdocs/docs/concepts/_local-limits.mdx'

  initialize:
    internal: true
    run: once
    cmds:
      - mkdir -p "{{.SCRATCH}}"

  exec:
    desc: Run a development command with worktree build and temporary directories
    deps: [initialize]
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}{{.CLI_ARGS | default (env "SHELL") | default "bash"}}'

  build:
    desc: Build every Rust crate, test and example for this platform
    deps: [initialize]
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo build --workspace --all-targets {{.CLI_ARGS}}'

  lint:
    desc: Run Clippy on all targets with the arguments after --, such as -p <name>
    deps: [initialize]
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo clippy {{.CLI_ARGS}} --all-targets -- -D warnings'

  lint:gate:
    desc: The full Rust lint gate, lint and then lint:shipped, each given the arguments after --
    cmds:
      - task: lint
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}
      - task: lint:shipped
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}

  lint:shipped:
    desc: Lint the shipped packages as a release builds them and refuse a test-util feature in them
    deps: [initialize]
    vars:
      SHIPPED: '{{.SHIPPED | default "isoplane-native isoplaned"}}'
    cmds:
      # Without the tests, and so without the `test-util` features the tests turn on:
      # code only those features reach is dead here.
      - '{{.REFUSE_TEST_FEATURES}}cargo clippy{{range splitList " " .SHIPPED}} -p {{.}}{{end}} --lib --bins {{.CLI_ARGS}} --message-format=json-render-diagnostics -- -D warnings'

  format:
    desc: Format both Cargo workspaces
    cmds:
      - cargo fmt --all
      - cargo fmt --all --manifest-path guests/Cargo.toml

  format:check:
    desc: Check formatting in both Cargo workspaces
    cmds:
      - cargo fmt --all --check
      - cargo fmt --all --check --manifest-path guests/Cargo.toml

  daemon:
    desc: Run isoplaned with the arguments after --
    deps: [initialize]
    cmds:
      - '{{.DEVELOPMENT_COMMAND}}cargo run -p isoplaned -- {{.CLI_ARGS}}'

  cli:
    run: once
    desc: Prepare the shared managed CLI and platform native support
    cmds:
      - task: managed:build
      - task: cli:stage

  cli:stage:
    internal: true
    run: once
    deps: [native]
    cmds:
      - '"{{.DOTNET}}" msbuild taskfiles/StageCli.proj -nologo -p:NativeLibrary="{{.NATIVE_TARGET}}/debug/{{.NATIVE_LIBRARY}}" -p:CliDirectory="{{dir .CLI}}" -p:Platform={{.PLATFORM}}'
