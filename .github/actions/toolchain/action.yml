name: Isoplane toolchain
description: Install only the toolchains needed by this job, using the repository pins.
inputs:
  rust:
    description: Install Rust and its lint/guest targets
    default: 'true'
  dotnet:
    description: Install the pinned .NET SDK
    default: 'false'
  nuget-cache:
    description: Name of this job's cache of downloaded NuGet packages; jobs that restore different projects use different names. Empty caches nothing.
    default: ''
  wasm:
    description: Install wasm-tools for managed runtime preparation
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install Task and configure bounded build parallelism
      shell: bash
      run: |
        source tools.env
        cat tools.env >> "$GITHUB_ENV"
        curl --fail --location --retry 3 https://taskfile.dev/install.sh -o "$RUNNER_TEMP/install-task.sh"
        sh "$RUNNER_TEMP/install-task.sh" -b "$RUNNER_TEMP/isoplane-tools" "v$GO_TASK_VERSION"
        echo "$RUNNER_TEMP/isoplane-tools" >> "$GITHUB_PATH"
        {
          echo CARGO_INCREMENTAL=0
          echo CARGO_BUILD_JOBS=2
          echo CARGO_PROFILE_DEV_DEBUG=0
          echo CARGO_PROFILE_TEST_DEBUG=0
          echo RUST_TEST_THREADS=2
          echo DOTNET_CLI_TELEMETRY_OPTOUT=1
          echo DOTNET_NOLOGO=1
        } >> "$GITHUB_ENV"
    - name: Install the pinned Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          curl --fail --location --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup.sh"
          sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        rustup toolchain install
    - name: Install .NET
      if: inputs.dotnet == 'true'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        global-json-file: global.json
    - name: Read the debugger fork's pinned commit, whose projects restore packages too
      id: debugger
      if: inputs.nuget-cache != ''
      shell: bash
      run: echo "commit=$(git rev-parse HEAD:tools/debugger-libs)" >> "$GITHUB_OUTPUT"
    - name: Cache downloaded NuGet packages
      if: inputs.nuget-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        key: nuget-${{ runner.os }}-${{ inputs.nuget-cache }}-${{ steps.debugger.outputs.commit }}-${{ hashFiles('global.json', 'Taskfile.yml', 'taskfiles/**', '**/nuget.config', '**/*.sln', '**/*.slnx', '**/*.slnf', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets') }}
        restore-keys: nuget-${{ runner.os }}-${{ inputs.nuget-cache }}-
        # This checkout packs and restores its own packages under one version, and NuGet uses a
        # package folder it already holds instead of extracting a later build of the same version.
        path: |
          ~/.nuget/packages/*
          !~/.nuget/packages/isoplane.*
    - name: Install wasm-tools
      if: inputs.wasm == 'true'
      shell: bash
      run: |
        # Runtime modules are produced on Linux; other platforms consume them.
        test "$RUNNER_OS" = Linux
        curl --fail --location --retry 3 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" -o "$RUNNER_TEMP/wasm-tools.tar.gz"
        tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/isoplane-tools" "wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools"
