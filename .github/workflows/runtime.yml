name: Runtime inputs
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compiler:
    outputs:
      key: ${{ steps.inputs.outputs.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Identify the pinned runtime release
        id: inputs
        run: |
          revision=$(git rev-parse HEAD:vendor/dotnet-runtime)
          echo "key=compiler-$revision" >> "$GITHUB_OUTPUT"
      - name: Download and verify the fork's compiler feed
        run: bash guest-runtime/fetch.sh .build/wasm32/runtime
      - run: tar -czf compiler.tar.gz .build/wasm32/runtime/feed .build/wasm32/runtime/packs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler
          path: compiler.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Record disk consumption
        if: always()
        run: df -h .; du -sh .build || true

  modules:
    needs: compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: compiler}
      - run: tar -xzf compiler.tar.gz && rm compiler.tar.gz
      - name: Identify module inputs
        id: inputs
        env:
          COMPILER_KEY: ${{ needs.compiler.outputs.key }}
        run: |
          git ls-files --stage -- guest-sdks/dotnet/Abi guest-sdks/dotnet/Runtime guest-sdks/dotnet/Sdk guest-sdks/dotnet/Build guest-sdks/dotnet/Conformance guest-sdks/dotnet/Analyzers guest-sdks/dotnet/Analyzers.CodeFixes guest-sdks/dotnet/AspNetCore guest-sdks/dotnet/native guest-sdks/dotnet/MonoRuntime ':(glob)guest-sdks/dotnet/*.csproj' ':(glob)guest-sdks/dotnet/*.props' ':(glob)guest-sdks/dotnet/*.targets' guest-sdks/dotnet/build-guest.sh tools/BuildProtocol licenses global.json nuget.config 'Directory.Build.*' Isoplane.slnx Isoplane.Runtime.slnf Taskfile.yml taskfiles/setup.yml taskfiles/managed.yml taskfiles/runtime.yml taskfiles/wasi-sdk.yml taskfiles/WasiWorkload Dockerfile .github/actions/toolchain .github/workflows/runtime.yml > "$RUNNER_TEMP/module-inputs"
          printf '%s\n' "$COMPILER_KEY" >> "$RUNNER_TEMP/module-inputs"
          digest=$(sha256sum "$RUNNER_TEMP/module-inputs" | cut -d ' ' -f 1)
          echo "key=modules-linux-v3-$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: modules
        with:
          key: ${{ steps.inputs.outputs.key }}
          path: |
            .build/wasm32/runtime-modules/*.wasm
            .build/wasm32/runtime-modules/*.wasm.runtime
            .build/wasm32/runtime-modules/runtime.json
            .build/wasm32/runtime-modules/native-imports.txt
      - uses: ./.github/actions/toolchain
        if: steps.modules.outputs.cache-hit != 'true'
        with: {rust: 'false', dotnet: 'true', wasm: 'true'}
      - name: Prepare runtime modules on a cache miss
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          ISOPLANE_TEST_RUNTIME_FEED: ${{ github.workspace }}/.build/wasm32/runtime/feed
        run: |
          task runtime:modules
      - name: Transfer only portable runtime inputs
        run: |
          tar -czf runtime.tar.gz .build/wasm32/runtime/feed .build/wasm32/runtime/packs .build/wasm32/runtime-modules/*.wasm .build/wasm32/runtime-modules/*.wasm.runtime .build/wasm32/runtime-modules/runtime.json .build/wasm32/runtime-modules/native-imports.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime
          path: runtime.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Record disk consumption
        if: always()
        run: df -h .; du -sh .build || true
