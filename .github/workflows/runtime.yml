name: Runtime inputs
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compiler:
    outputs:
      key: ${{ steps.inputs.outputs.key }}
    runs-on: ubuntu-24.04
    # Covers the runtime fork's own 240-minute build limit, for a pin whose
    # build is still running when this job starts.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Identify the pinned runtime revision
        id: inputs
        run: |
          revision=$(git rev-parse HEAD:vendor/dotnet-runtime)
          echo "key=compiler-$revision" >> "$GITHUB_OUTPUT"
      - name: Download and verify the fork's compiler feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash guest-runtime/fetch.sh .build/wasm32/runtime
      - run: tar -czf compiler.tar.gz .build/wasm32/runtime/feed .build/wasm32/runtime/packs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiler
          path: compiler.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Record disk consumption
        if: always()
        run: df -h .; du -sh .build || true

  modules:
    needs: compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: {name: compiler}
      - run: tar -xzf compiler.tar.gz && rm compiler.tar.gz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: modules
        with:
          key: >-
            modules-linux-v3-${{ needs.compiler.outputs.key }}-${{ hashFiles(
              'guest-sdks/dotnet/Abi/**',
              'guest-sdks/dotnet/Runtime/**',
              'guest-sdks/dotnet/Sdk/**',
              'guest-sdks/dotnet/Build/**',
              'guest-sdks/dotnet/Conformance/**',
              'guest-sdks/dotnet/Analyzers/**',
              'guest-sdks/dotnet/Analyzers.CodeFixes/**',
              'guest-sdks/dotnet/AspNetCore/**',
              'guest-sdks/dotnet/native/**',
              'guest-sdks/dotnet/MonoRuntime/**',
              'guest-sdks/dotnet/*.csproj',
              'guest-sdks/dotnet/*.props',
              'guest-sdks/dotnet/*.targets',
              'guest-sdks/dotnet/build-guest.sh',
              'tools/BuildProtocol/**',
              'licenses/**',
              'global.json',
              'nuget.config',
              'Directory.Build.*',
              'Isoplane.slnx',
              'Isoplane.Runtime.slnf',
              'Taskfile.yml',
              'tools.env',
              'taskfiles/setup.yml',
              'taskfiles/managed.yml',
              'taskfiles/runtime.yml',
              'taskfiles/WasiWorkload/**',
              'guest-runtime/manifest.env',
              'guest-runtime/build.sh',
              '.github/actions/toolchain/**',
              '.github/workflows/runtime.yml') }}
          path: |
            .build/wasm32/runtime-modules/*.wasm
            .build/wasm32/runtime-modules/*.wasm.runtime
            .build/wasm32/runtime-modules/runtime.json
            .build/wasm32/runtime-modules/native-imports.txt
      - uses: ./.github/actions/toolchain
        if: steps.modules.outputs.cache-hit != 'true'
        with: {rust: 'false', dotnet: 'true', wasm: 'true'}
      - name: Prepare runtime modules on a cache miss
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          ISOPLANE_TEST_RUNTIME_FEED: ${{ github.workspace }}/.build/wasm32/runtime/feed
        run: |
          task runtime:modules
      - name: Transfer only portable runtime inputs
        run: |
          tar -czf runtime.tar.gz .build/wasm32/runtime/feed .build/wasm32/runtime/packs .build/wasm32/runtime-modules/*.wasm .build/wasm32/runtime-modules/*.wasm.runtime .build/wasm32/runtime-modules/runtime.json .build/wasm32/runtime-modules/native-imports.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime
          path: runtime.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Record disk consumption
        if: always()
        run: df -h .; du -sh .build || true
