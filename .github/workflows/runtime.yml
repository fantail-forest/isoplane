name: Runtime inputs
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Identify compiler inputs, including submodule commits
        id: inputs
        run: |
          digest=$(git ls-files --stage -- .gitmodules vendor ':(glob)guest-runtime/*.sh' ':(glob)guest-runtime/*.py' guest-runtime/manifest.env Taskfile.yml global.json nuget.config Directory.Build.props taskfiles/setup.yml taskfiles/runtime.yml taskfiles/WasiWorkload Dockerfile .github/actions/toolchain .github/workflows/runtime.yml | sha256sum | cut -d ' ' -f 1)
          echo "key=compiler-linux-v1-$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: compiler
        with:
          key: ${{ steps.inputs.outputs.key }}
          # Only portable outputs; no source, absolute-path build state or native caches.
          path: |
            .build/wasm32/runtime/feed
            .build/wasm32/runtime/packs
      - uses: ./.github/actions/toolchain
        if: steps.compiler.outputs.cache-hit != 'true'
        with: {rust: 'false', dotnet: 'true'}
      - name: Build compiler feed on a cache miss
        if: steps.compiler.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libkrb5-dev libssl-dev zlib1g-dev
          git submodule update --init --depth 1 vendor/dotnet-runtime vendor/openssl vendor/icu
          task runtime:compiler
      - run: python3 guest-runtime/feed-identity.py verify-artifact .build/wasm32/runtime/feed
      - run: tar -czf compiler.tar.gz .build/wasm32/runtime/feed .build/wasm32/runtime/packs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler
          path: compiler.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Record disk consumption
        if: always()
        run: df -h .; du -sh .build || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: compiler-logs
          path: .build/linux-x64/development/runtime-work/logs
          retention-days: 7

  modules:
    needs: compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: compiler}
      - run: tar -xzf compiler.tar.gz && rm compiler.tar.gz
      - name: Identify module inputs
        id: inputs
        run: |
          # Native CLI code participates in preparation; include its transitive source graph.
          digest=$(git ls-files --stage -- .gitmodules Cargo.toml Cargo.lock crates tools guest-sdks guest-runtime vendor trust licenses global.json nuget.config Directory.Build.props Isoplane.slnx Isoplane.Build.slnf Taskfile.yml taskfiles Dockerfile .cargo .github/actions/toolchain .github/workflows/runtime.yml ':(exclude)tools/vscode-isoplane' | sha256sum | cut -d ' ' -f 1)
          echo "key=modules-linux-v2-$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: modules
        with:
          key: ${{ steps.inputs.outputs.key }}
          path: |
            .build/wasm32/runtime-modules/*.wasm
            .build/wasm32/runtime-modules/*.wasm.runtime
            .build/wasm32/runtime-modules/runtime.json
            .build/wasm32/runtime-modules/native-imports.txt
      - uses: ./.github/actions/toolchain
        if: steps.modules.outputs.cache-hit != 'true'
        with: {dotnet: 'true', wasm: 'true'}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        if: steps.modules.outputs.cache-hit != 'true'
        with:
          workspaces: '. -> .build/linux-x64/native'
          shared-key: push-linux
          save-if: 'false'
      - name: Prepare runtime modules on a cache miss
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          ISOPLANE_TEST_RUNTIME_FEED: ${{ github.workspace }}/.build/wasm32/runtime/feed
        run: |
          git submodule update --init --depth 1 tools/debugger-libs
          task runtime:modules
      - name: Transfer only portable runtime inputs
        run: |
          tar -czf runtime.tar.gz .build/wasm32/runtime/feed .build/wasm32/runtime/packs .build/wasm32/runtime-modules/*.wasm .build/wasm32/runtime-modules/*.wasm.runtime .build/wasm32/runtime-modules/runtime.json .build/wasm32/runtime-modules/native-imports.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime
          path: runtime.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Record disk consumption
        if: always()
        run: df -h .; du -sh .build || true
