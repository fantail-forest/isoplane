name: Move fork pins
on:
  repository_dispatch:
    types: [fork-landed]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
# A queued run recomputes everything, so it covers any run it replaces in the queue.
concurrency:
  group: move-fork-pins
  cancel-in-progress: false
jobs:
  move:
    name: Move pins in open pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: isoplane-helper
    steps:
      # A push made with the workflow's own token would not start CI on the pull request.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          client-id: ${{ vars.ISOPLANE_HELPER_CLIENT_ID }}
          private-key: ${{ secrets.ISOPLANE_HELPER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      # The default branch's script runs with the app token, so a pull request cannot change what that token does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Move the pins of each open pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SENDER: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "Dispatch payload, which decides nothing: $SENDER"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "$(gh api "users/${APP_SLUG}[bot]" --jq .id)+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          # A pull request from a fork of this repository has a head branch the app cannot push to.
          pulls=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"')
          failed=0
          while read -r number branch; do
            [ -n "$number" ] || continue
            checkout="$RUNNER_TEMP/pull-$number"
            report=""
            if ! git clone --quiet --depth 1 --no-recurse-submodules --branch "$branch" \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$checkout"; then
              outcome="could not be cloned"
              failed=1
            elif ! report=$(cd "$checkout" && "$GITHUB_WORKSPACE/scripts/move-fork-pins" --commit 2>&1); then
              outcome="could not be checked"
              failed=1
            elif [ "$(git -C "$checkout" rev-parse HEAD)" = "$(git -C "$checkout" rev-parse "origin/$branch")" ]; then
              outcome="nothing moved"
            elif git -C "$checkout" push --quiet origin "HEAD:refs/heads/$branch"; then
              outcome="pins moved"
            else
              outcome="pins moved here, but the push was refused; the branch may have changed meanwhile"
              failed=1
            fi
            printf '#%s (%s): %s\n\n~~~\n%s\n~~~\n\n' "$number" "$branch" "$outcome" "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<<"$pulls"
          exit "$failed"
