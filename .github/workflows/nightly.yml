name: Nightly
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.previous.outputs.sha == '' || steps.paths.outputs.integration == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: previous
        if: github.event_name == 'schedule'
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'nightly.yml', status: 'success',
              branch: context.ref.replace('refs/heads/', ''), per_page: 1
            });
            const previous = data.workflow_runs[0]?.head_sha;
            // A rewritten branch can lose the old object. Revalidate everything then.
            if (previous) {
              const result = await exec.getExecOutput('git', ['cat-file', '-e', `${previous}^{commit}`], {ignoreReturnCode: true});
              if (result.exitCode === 0) core.setOutput('sha', previous);
            }
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        if: steps.previous.outputs.sha != ''
        with:
          token: ''
          base: ${{ steps.previous.outputs.sha }}
          ref: ${{ github.sha }}
          filters: .github/changes.yml

  runtime:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/runtime.yml

  integration:
    needs: runtime
    uses: ./.github/workflows/integration.yml
    with:
      suites: '["sdk", "release"]'

  release-build:
    needs: runtime
    uses: ./.github/workflows/release-build.yml
