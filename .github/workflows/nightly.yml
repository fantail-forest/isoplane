name: Nightly
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.previous.outputs.sha == '' || steps.paths.outputs.integration == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: previous
        if: github.event_name == 'schedule'
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'nightly.yml', status: 'success',
              branch: context.ref.replace('refs/heads/', ''), per_page: 1
            });
            const previous = data.workflow_runs[0]?.head_sha;
            // A rewritten branch can lose the old object. Revalidate everything then.
            if (previous) {
              const result = await exec.getExecOutput('git', ['cat-file', '-e', `${previous}^{commit}`], {ignoreReturnCode: true});
              if (result.exitCode === 0) core.setOutput('sha', previous);
            }
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: paths
        if: steps.previous.outputs.sha != ''
        with:
          token: ''
          base: ${{ steps.previous.outputs.sha }}
          ref: ${{ github.sha }}
          filters: .github/changes.yml

  integration:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/integration.yml
    with:
      suites: '["host", "sdk", "release"]'
