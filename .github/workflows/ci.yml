name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tooling: ${{ steps.paths.outputs.tooling }}
      rust: ${{ steps.paths.outputs.rust }}
      managed: ${{ steps.paths.outputs.managed }}
      docs: ${{ steps.paths.outputs.docs }}
      editor: ${{ steps.paths.outputs.editor }}
      integration: ${{ steps.paths.outputs.integration }}
      journeys: ${{ steps.paths.outputs.journeys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        if: github.event_name != 'workflow_dispatch'
        with:
          # Use local Git on PRs too: no API token or PR write/read permission needed.
          token: ''
          base: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.event.repository.default_branch }}
          ref: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.ref || github.sha }}
          filters: .github/changes.yml

  tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/toolchain
        with: {rust: 'false'}
      - name: Check workflow syntax
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/toolchain
        with: {wasm: 'true'}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: '. -> .build/linux-x64/native'
          shared-key: push-linux
          cache-on-failure: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: task ci:rust
      - name: Record disk consumption
        if: always()
        run: df -h .; du -sh .build || true

  native:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, platform: win-x64}
          - {os: macos-15, platform: osx-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: '. -> .build/${{ matrix.platform }}/native'
          shared-key: push-${{ matrix.platform }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: task ci:native

  managed:
    needs: changes
    if: needs.changes.outputs.managed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/toolchain
        with: {rust: 'false', dotnet: 'true', nuget-cache: managed}
      - run: task ci:managed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: managed-test-results
          path: .build/test-results
          retention-days: 7

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/toolchain
        with: {dotnet: 'true', nuget-cache: docs}
      - run: pnpm --dir docs/userdocs install --frozen-lockfile
      - run: pnpm --dir docs/userdocs test
      - run: pnpm --dir docs/userdocs build

  editor:
    needs: changes
    if: needs.changes.outputs.editor == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version-file: .node-version}
      - run: node --test tools/vscode-isoplane/test/*.test.js
      - run: npm --prefix tools/vscode-isoplane ci
      - run: npm --prefix tools/vscode-isoplane run package

  runtime:
    needs: changes
    if: needs.changes.outputs.integration == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/runtime.yml

  integration:
    needs: [changes, runtime]
    uses: ./.github/workflows/integration.yml
    with:
      suites: ${{ (needs.changes.outputs.managed == 'true' || needs.changes.outputs.editor == 'true' || needs.changes.outputs.journeys == 'true' || github.event_name == 'workflow_dispatch') && '["sdk"]' || '[]' }}

  pins:
    name: Fork pins have landed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/toolchain
        with: {rust: 'false'}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: task ci:pins

  required:
    name: CI passed
    needs: [changes, tooling, rust, native, managed, docs, editor, runtime, integration, pins]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject failed or cancelled checks, allowing unchanged components
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] not in ('success', 'skipped')]
          if failed:
              raise SystemExit('Failed or cancelled checks: ' + ', '.join(failed))
          PY
